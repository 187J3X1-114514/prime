    public static final int DESCRIPTOR_ACCUMULATION_IMAGE = ${schema.descriptors.accumulationImage};
    public static final int DESCRIPTOR_SKY_VIEW = ${schema.descriptors.skyView};
    public static final int DESCRIPTOR_TRANSMITTANCE_LOW = ${schema.descriptors.transmittanceLow};
    public static final int DESCRIPTOR_TRANSMITTANCE_HIGH = ${schema.descriptors.transmittanceHigh};
    public static final int DESCRIPTOR_AERIAL_RADIANCE = ${schema.descriptors.aerialRadiance};
    public static final int DESCRIPTOR_AERIAL_TRANSMITTANCE = ${schema.descriptors.aerialTransmittance};
    public static final int DESCRIPTOR_NRD_NOISY_DIFFUSE = ${schema.descriptors.nrdNoisyDiffuse};
    public static final int DESCRIPTOR_NRD_NORMAL_ROUGHNESS = ${schema.descriptors.nrdNormalRoughness};
    public static final int DESCRIPTOR_NRD_VIEW_Z = ${schema.descriptors.nrdViewZ};
    public static final int DESCRIPTOR_NRD_MOTION = ${schema.descriptors.nrdMotion};
