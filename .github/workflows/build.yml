name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Set up Vulkan shader toolchain
        uses: humbletim/setup-vulkan-sdk@c25f41106918cde0bf347e6f201277392b3a9e9d # v1.2.1
        with:
          vulkan-query-version: 1.4.350.0
          vulkan-components: Glslang, SPIRV-Tools
          vulkan-use-cache: true
      - name: Report shader tool versions
        run: glslangValidator --version && spirv-val --version
      - name: Set up headless Vulkan compute
        run: |
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers vulkan-tools
          lvp_icd="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$lvp_icd"
          echo "VK_DRIVER_FILES=$lvp_icd" >> "$GITHUB_ENV"
          VK_DRIVER_FILES="$lvp_icd" vulkaninfo --summary
      - name: Build and test
        run: ./gradlew --no-daemon --stacktrace clean build shaderTest
      - name: Capture test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: prime-test-reports-${{ github.sha }}
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
      - name: Capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: prime-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
