// Generated from shaders/abi.json. The Vulkan range and shader block share this layout.
layout(push_constant) uniform PrimeMotionPushConstants {
${glslNrdMotionPushFields}
} primeMotionPush;

#endif
"""
	}
}

abstract class CompilePrimeShaders extends DefaultTask {
	@InputDirectory
	abstract DirectoryProperty getSourceDirectory()

	@InputDirectory
	abstract DirectoryProperty getIncludeDirectory()

	@Optional
	@InputDirectory
	abstract DirectoryProperty getAdditionalIncludeDirectory()

	@OutputDirectory
	abstract DirectoryProperty getOutputDirectory()

	@Input
	abstract Property<String> getGlslangValidator()

	@Input
	abstract Property<String> getSpirvValidator()

	@Input
	abstract Property<String> getSpirvOptimizer()

	@Input
	abstract Property<Boolean> getDebugInfo()

	@javax.inject.Inject
	abstract org.gradle.process.ExecOperations getExecOperations()

	@javax.inject.Inject
	abstract org.gradle.api.file.FileSystemOperations getFileSystemOperations()

	@TaskAction
	void compile() {
		def sources = sourceDirectory.get().asFileTree.matching {
			include '**/*.rgen', '**/*.rmiss', '**/*.rchit', '**/*.rahit', '**/*.comp'
		}.files.sort { it.absolutePath }
		if (sources.empty) {
			throw new GradleException('No Prime Vulkan shaders were found')
		}

		def scratch = new File(temporaryDir, 'spv')
		fileSystemOperations.delete { delete scratch }
		scratch.mkdirs()
		def compileShader = { File source, File output, List<String> definitions ->
			def arguments = ['-V', '--target-env', 'vulkan1.2',
					debugInfo.get() ? '-g' : '-g0']
			arguments.addAll(definitions)
			arguments.add("-I${includeDirectory.get().asFile.absolutePath}")
			if (additionalIncludeDirectory.isPresent()) {
				arguments.add(
						"-I${additionalIncludeDirectory.get().asFile.absolutePath}")
			}
			arguments.add(source.absolutePath)
			arguments.addAll(['-o', output.absolutePath])
			execOperations.exec {
				commandLine glslangValidator.get(), *arguments
			}
			if (!debugInfo.get()) {
				def optimized = new File(output.parentFile, output.name + '.optimized')
				// These passes only canonicalize SPIR-V structure and remove redundant operations.
				// Do not add aggressive inlining here: it greatly increases driver compile time.
				// Dead functions may be removed after glslang has compiled the complete standalone
				// RoboCute validation module. Function-local DCE removes inactive mode branches and
				// unconsumed aggregate fields without changing live floating-point evaluation order.
				def optimizerArguments = [
						'--remove-duplicates',
						'--eliminate-local-single-block',
						'--eliminate-local-single-store',
						'--ssa-rewrite',
						'--redundancy-elimination',
						'--simplify-instructions',
						'--eliminate-dead-branches',
						'--eliminate-dead-code-aggressive',
						'--eliminate-dead-inserts']
				// Hit and miss modules are compiled independently from their raygen caller. Pruning
				// an incoming payload member renumbers the remaining struct fields and changes the
				// cross-stage payload ABI even though each standalone module still validates.
				if (!(source.name.endsWith('.rmiss')
						|| source.name.endsWith('.rchit')
						|| source.name.endsWith('.rahit'))) {
					optimizerArguments.add('--eliminate-dead-members')
				}
				optimizerArguments.addAll([
						'--simplify-instructions',
						'--eliminate-dead-functions',
						'--merge-blocks',
						'--compact-ids',
						output.absolutePath,
						'-o', optimized.absolutePath])
				execOperations.exec {
					commandLine spirvOptimizer.get(), *optimizerArguments
				}
				java.nio.file.Files.move(
						optimized.toPath(), output.toPath(),
						java.nio.file.StandardCopyOption.REPLACE_EXISTING)
			}
			execOperations.exec {
				commandLine spirvValidator.get(), '--target-env', 'vulkan1.2', output.absolutePath
			}
		}
		def specializeWavefront = { File input, File output, int stage ->
			execOperations.exec {
				commandLine spirvOptimizer.get(),
						'--set-spec-const-default-value', "0:${stage}",
						'--freeze-spec-const',
						'--fold-spec-const-op-composite',
						'--eliminate-dead-branches',
						'--eliminate-dead-code-aggressive',
						'--eliminate-dead-inserts',
						'--eliminate-dead-members',
						'--simplify-instructions',
						'--eliminate-dead-functions',
						'--merge-blocks',
						'--compact-ids',
						input.absolutePath,
						'-o', output.absolutePath
			}
			execOperations.exec {
				commandLine spirvValidator.get(), '--target-env', 'vulkan1.2', output.absolutePath
			}
		}
		sources.each { source ->
			if (source.name == 'realtime_wavefront.rgen'
					|| source.name == 'lightweight_wavefront.rgen'
					|| source.name == 'offline_wavefront.rgen') {
				// Freeze every scheduler stage before the driver sees it. Each transport profile
				// remains a separate program while sharing one GLSL front end within that profile.
				def offline = source.name == 'offline_wavefront.rgen'
				def lightweight = source.name == 'lightweight_wavefront.rgen'
				def stages = offline
						? [
							[name: 'head', value: 0],
							[name: 'step', value: 1],
							[name: 'area', value: 2],
							[name: 'tail', value: 3],
							[name: 'resolve', value: 4]
						]
						: lightweight
						? [
							[name: 'head', value: 0],
							[name: 'step', value: 1],
							[name: 'resolve', value: 2]
						]
						: [
							[name: 'head', value: 0],
							[name: 'tail', value: 2],
							[name: 'resolve', value: 3]
						]
				def prefix = offline
						? 'offline_wavefront'
						: lightweight ? 'lightweight_wavefront' : 'realtime_wavefront'
				def variants = [
						[name: '', definitions: []],
						[name: '_ser', definitions: [
								'-DPRIME_ENABLE_SER=1',
								'-DPRIME_ENABLE_SUBGROUP_QUEUE=1'
						]]
				]
				variants.each { variant ->
					def generic = new File(
							scratch,
							"${prefix}${variant.name}.generic.rgen.spv")
					compileShader(source, generic, variant.definitions)
					stages.each { stage ->
						def output = new File(
								scratch,
								"${prefix}_${stage.name}${variant.name}.rgen.spv")
						specializeWavefront(generic, output, stage.value)
					}
					java.nio.file.Files.delete(generic.toPath())
					if (!offline && !lightweight) {
						def deferredDefinitions = new ArrayList<String>(variant.definitions)
						deferredDefinitions.add('-DPRIME_DEFER_SECONDARY_AREA_NEE=1')
						def deferred = new File(
								scratch,
								"${prefix}_deferred${variant.name}.generic.rgen.spv")
						compileShader(source, deferred, deferredDefinitions)
						[
								[name: 'step', value: 1],
								[name: 'area', value: 4]
						].each { stage ->
							def output = new File(
									scratch,
									"${prefix}_${stage.name}${variant.name}.rgen.spv")
							specializeWavefront(deferred, output, stage.value)
						}
						java.nio.file.Files.delete(deferred.toPath())
					}
				}
			} else {
				def output = new File(scratch, source.name + '.spv')
				compileShader(source, output, [])
				// Conformance-only shaders force otherwise dormant libraries through glslang and
				// spirv-val, but are never loaded at runtime and must not inflate the distributable
				// jar.
				if (source.name.endsWith('_validation.comp')) {
					java.nio.file.Files.delete(output.toPath())
				}
			}
		}

		def published = new File(outputDirectory.get().asFile, 'prime/shaders')
		fileSystemOperations.delete { delete published }
		published.mkdirs()
		scratch.listFiles().each { source ->
			java.nio.file.Files.move(source.toPath(), new File(published, source.name).toPath(),
					java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		}
	}
}

def resolveVulkanTool = { String name ->
	def windows = System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).contains('win')
	def extension = windows ? '.exe' : ''
	def sdk = System.getenv('VULKAN_SDK')
	if (sdk) {
		def binDirectories = windows ? ['Bin', 'bin'] : ['bin', 'Bin']
		for (def binDirectory : binDirectories) {
			def candidate = file("${sdk}/${binDirectory}/${name}${extension}")
			if (candidate.exists()) {
				return candidate.absolutePath
			}
		}
	}
	return "${name}${extension}"
}

def generateShaderAbi = tasks.register('generateShaderAbi', GenerateShaderAbi) {
	schemaFile = file('shaders/abi.json')
	javaOutputDirectory = shaderAbiJavaRoot
	glslOutputDirectory = shaderAbiIncludeRoot
}

def shaderIncludeReport = layout.buildDirectory.file(
		'reports/prime-shaders/include-graph.txt')
def verifyShaderIncludeGraph = tasks.register('verifyShaderIncludeGraph') {
	group = 'verification'
	description = 'Verifies that Prime production and test shader includes are resolvable and acyclic.'
	dependsOn generateShaderAbi
	inputs.files(fileTree('shaders'), fileTree('src/test/shaders'), shaderAbiIncludeRoot)
	outputs.file(shaderIncludeReport)

	doLast {
		def sources = []
		[file('shaders'), file('src/test/shaders'), shaderAbiIncludeRoot.get().asFile]
				.each { root ->
			if (root.isDirectory()) {
				sources.addAll(fileTree(root).files.findAll { source ->
					source.name.endsWith('.glsl')
							|| source.name.endsWith('.rgen')
							|| source.name.endsWith('.rmiss')
							|| source.name.endsWith('.rchit')
							|| source.name.endsWith('.rahit')
							|| source.name.endsWith('.comp')
				})
			}
		}
		def byName = new TreeMap<String, File>()
		sources.each { source ->
			def previous = byName.put(source.name, source)
			if (previous != null) {
				throw new GradleException(
						"Shader include name is ambiguous: ${source.name}")
			}
		}
		def graph = new TreeMap<String, Set<String>>()
		def includePattern = java.util.regex.Pattern.compile(
				'(?m)^\\s*#\\s*include\\s+"([^"]+)"')
		sources.each { source ->
			def sourceName = source.name
			def targets = graph.computeIfAbsent(sourceName) { new TreeSet<String>() }
			def matcher = includePattern.matcher(source.getText('UTF-8'))
			while (matcher.find()) {
				def includeName = new File(matcher.group(1)).name
				if (!byName.containsKey(includeName)) {
					throw new GradleException(
							"Unresolved shader include ${matcher.group(1)} from ${source}")
				}
				targets.add(includeName)
			}
		}

		def state = new HashMap<String, Integer>()
		def stack = []
		Closure<Void> visit
		visit = { String source ->
			if (state[source] == 1) {
				int start = stack.indexOf(source)
				def cycle = stack.subList(start, stack.size()) + source
				throw new GradleException(
						"Shader include cycle: ${cycle.join(' -> ')}")
			}
			if (state[source] == 2) {
				return
			}
			state[source] = 1
			stack.add(source)
			(graph[source] ?: Collections.emptySet()).each { visit(it) }
			stack.remove(stack.size() - 1)
			state[source] = 2
		}
		graph.keySet().each { visit(it) }

		def report = shaderIncludeReport.get().asFile
		report.parentFile.mkdirs()
		report.setText(
				graph.collectMany { source, targets ->
					targets.collect { "${source} -> ${it}" }
				}.join(System.lineSeparator()) + System.lineSeparator(),
				'UTF-8')
	}
}

def compileShaders = tasks.register('compileShaders', CompilePrimeShaders) {
	dependsOn generateShaderAbi, verifyRoboCutePort, verifyShaderIncludeGraph
	sourceDirectory = file('shaders')
	includeDirectory = shaderAbiIncludeRoot
	outputDirectory = compiledShaderRoot
	glslangValidator = resolveVulkanTool('glslangValidator')
	spirvValidator = resolveVulkanTool('spirv-val')
	spirvOptimizer = resolveVulkanTool('spirv-opt')
	debugInfo = providers.gradleProperty('primeShaderDebug')
			.map { value -> value.toBoolean() }
			.orElse(false)
}

def compileTestShaders = tasks.register('compileTestShaders', CompilePrimeShaders) {
	dependsOn generateShaderAbi, verifyRoboCutePort, verifyShaderIncludeGraph
	sourceDirectory = file('src/test/shaders')
	includeDirectory = file('shaders')
	additionalIncludeDirectory = shaderAbiIncludeRoot
	outputDirectory = compiledTestShaderRoot
	glslangValidator = resolveVulkanTool('glslangValidator')
	spirvValidator = resolveVulkanTool('spirv-val')
	spirvOptimizer = resolveVulkanTool('spirv-opt')
	debugInfo = false
}

sourceSets.client.java.srcDir(files(shaderAbiJavaRoot).builtBy(generateShaderAbi))
sourceSets.client.resources.srcDir(files(compiledShaderRoot).builtBy(compileShaders))
sourceSets.test.compileClasspath += sourceSets.client.output
sourceSets.test.runtimeClasspath += sourceSets.client.output

tasks.withType(Test).configureEach {
	dependsOn compileTestShaders
	inputs.dir(compiledTestShaderRoot)
	useJUnitPlatform()
	// The NRD ABI tests intentionally load the bundled bridge through LWJGL. Declare native and
	// LWJGL legacy-memory access explicitly on Java 25, and keep JOML on its supported safe path, so
	// dependency warnings do not hide actionable test failures.
	jvmArgs '--enable-native-access=ALL-UNNAMED', '--sun-misc-unsafe-memory-access=allow'
	systemProperty 'joml.nounsafe', 'true'
	doFirst {
		systemProperty 'prime.test.shaderDirectory',
				new File(compiledTestShaderRoot.get().asFile, 'prime/shaders').absolutePath
	}
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'gpu-shader'
	}
}

tasks.register('shaderTest', Test) {
	group = 'verification'
	description = 'Runs GPU shader property tests and requires a usable Vulkan compute device.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'gpu-shader'
	}
	systemProperty 'prime.shaderTests.required', 'true'
	outputs.upToDateWhen { false }
}
