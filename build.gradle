tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.compilerArgs += ['-Xlint:all', '-Werror']
}

tasks.withType(Test).configureEach {
	dependsOn compileTestShaders
	inputs.dir(compiledTestShaderRoot)
	useJUnitPlatform()
	// The NRD ABI tests intentionally load the bundled bridge through LWJGL. Declare native and
	// LWJGL legacy-memory access explicitly on Java 25, and keep JOML on its supported safe path, so
	// dependency warnings do not hide actionable test failures.
	jvmArgs '--enable-native-access=ALL-UNNAMED', '--sun-misc-unsafe-memory-access=allow'
	systemProperty 'joml.nounsafe', 'true'
	doFirst {
		systemProperty 'prime.test.shaderDirectory',
				new File(compiledTestShaderRoot.get().asFile, 'prime/shaders').absolutePath
	}
