    public static final int DESCRIPTOR_NRD_PRIMARY_POSITION = ${schema.descriptors.nrdPrimaryPosition};
    public static final int DESCRIPTOR_NRD_NOISY_SPECULAR = ${schema.descriptors.nrdNoisySpecular};
    public static final int DESCRIPTOR_NRD_SPECULAR_MATERIAL = ${schema.descriptors.nrdSpecularMaterial};
    public static final int DESCRIPTOR_TRANSMISSION_GGX_ENERGY = ${schema.descriptors.transmissionGgxEnergy};
