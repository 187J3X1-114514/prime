"""

		def glslDir = glslOutputDirectory.get().asFile
		glslDir.mkdirs()
		new File(glslDir, 'prime_abi.glsl').text = """\
#ifndef PRIME_ABI_GLSL
#define PRIME_ABI_GLSL

#extension GL_EXT_ray_tracing : require
#extension GL_EXT_buffer_reference2 : require
#extension GL_EXT_shader_explicit_arithmetic_types_int64 : require

#include "prime_color_contract.glsl"

#define PRIME_LEVEL_15_BLOCK_INTENSITY ${emissionContract.level15BlockIntensity}
#define PRIME_PRIMITIVE_RECORD_SIZE ${primitive.size}
#define PRIME_SECTION_RECORD_SIZE ${section.size}
#define PRIME_LIGHT_NODE_SIZE ${lightNode.size}
#define PRIME_LIGHT_NODE_FORWARD_SIZE ${lightNodeForward.size}
#define PRIME_LIGHT_NODE_REVERSE_SIZE ${lightNodeReverse.size}
#define PRIME_LIGHT_EMITTER_SIZE ${lightEmitter.size}
#define PRIME_LIGHT_CELL_SIZE ${lightCell.size}
#define PRIME_SECTION_LIGHT_HEADER_SIZE ${sectionLightHeader.size}
#define PRIME_INTEGRATOR_RECORD_SIZE ${integrator.size}
#define PRIME_PATH_STATE_SIZE ${pathState.size}
#define PRIME_TRACE_PAYLOAD_SIZE ${tracePayload.size}
#define PRIME_SURFACE_INTERACTION_SIZE ${surfaceInteraction.size}
#define PRIME_PUSH_CONSTANT_SIZE ${push.size}
#define PRIME_DESCRIPTOR_TRANSMISSION_GGX_ENERGY ${schema.descriptors.transmissionGgxEnergy}
#define PRIME_PATH_CAMERA_IN_WATER_MASK ${schema.pathControl.cameraInWaterMask}u
#define PRIME_PATH_JITTER_PHASE_MASK ${schema.pathControl.jitterPhaseMask}u
#define PRIME_PATH_SUN_EV_QUARTER_SHIFT ${schema.pathControl.sunEvQuarterShift}u
#define PRIME_PATH_BLOCK_LIGHT_EV_QUARTER_SHIFT ${schema.pathControl.blockLightEvQuarterShift}u
#define PRIME_PATH_EV_QUARTER_MASK ${schema.pathControl.evQuarterMask}u
#define PRIME_PATH_EV_QUARTER_BIAS ${schema.pathControl.evQuarterBias}
#define PRIME_PATH_MATERIAL_ROUGHNESS_SHIFT ${schema.pathControl.materialRoughnessShift}u
#define PRIME_PATH_MATERIAL_ROUGHNESS_MASK ${schema.pathControl.materialRoughnessMask}u
#define PRIME_PATH_MATERIAL_ROUGHNESS_STEPS_PER_UNIT ${schema.pathControl.materialRoughnessStepsPerUnit}.0
#define PRIME_RUSSIAN_ROULETTE_START ${schema.pathControl.russianRouletteStart}u
#define PRIME_CUTOUT_ALPHA_THRESHOLD ${schema.cutoutAlphaThreshold}
struct PrimitiveRecord {
${glslStructFields(primitive)}
};

struct SectionRecord {
${glslStructFields(section)}
};

struct LightNode {
${glslStructFields(lightNode)}
};

struct LightNodeForward {
${glslStructFields(lightNodeForward)}
};

struct LightNodeReverse {
${glslStructFields(lightNodeReverse)}
};

struct LightEmitter {
${glslStructFields(lightEmitter)}
};

struct LightCell {
${glslStructFields(lightCell)}
};

struct SectionLightHeader {
${glslStructFields(sectionLightHeader)}
};

// These explicit records deliberately contain no execution-local state. They can be moved to
// storage-buffer queues by a future wavefront scheduler without changing integrator semantics.
// Every color or radiance field in these records is linear Rec.2020 D65. This is part of the
// estimator ABI, not a presentation choice; changing it requires a coordinated ABI migration.
struct IntegratorRecord {
${glslStructFields(integrator)}
};

struct PathState {
${glslStructFields(pathState)}
};

struct TracePayload {
${glslStructFields(tracePayload)}
};

struct SurfaceInteraction {
${glslStructFields(surfaceInteraction)}
};

layout(buffer_reference, buffer_reference_align = 8) readonly buffer PrimitiveBuffer {
    PrimitiveRecord records[];
};

layout(buffer_reference, buffer_reference_align = 8) readonly buffer SectionTable {
    SectionRecord sections[];
};

layout(buffer_reference, buffer_reference_align = 16) readonly buffer LightNodeBuffer {
    LightNode nodes[];
};

layout(buffer_reference, buffer_reference_align = 4) readonly buffer LightNodeForwardBuffer {
    LightNodeForward nodes[];
};

layout(buffer_reference, buffer_reference_align = 4) readonly buffer LightNodeReverseBuffer {
    LightNodeReverse nodes[];
};

layout(buffer_reference, buffer_reference_align = 16) readonly buffer LightEmitterBuffer {
    LightEmitter emitters[];
};

layout(buffer_reference, buffer_reference_align = 16) readonly buffer LightCellBuffer {
    LightCell cells[];
};

layout(buffer_reference, buffer_reference_align = 8) readonly buffer SectionLightHeaderBuffer {
    SectionLightHeader header;
};

layout(buffer_reference, buffer_reference_align = 16) readonly buffer IntegratorBuffer {
    IntegratorRecord record;
};

layout(push_constant) uniform PrimePushConstants {
${glslPushFields}
} primePush;

layout(set = 0, binding = ${schema.descriptors.tlas}) uniform accelerationStructureEXT primeScene;
layout(set = 0, binding = ${schema.descriptors.outputImage}, rgba8) uniform image2D primeOutput;
layout(set = 0, binding = ${schema.descriptors.blockAtlas}) uniform sampler2D primeBlockAtlas;
layout(set = 0, binding = ${schema.descriptors.labPbrNormalAtlas}) uniform sampler2D primeLabPbrNormalAtlas;
layout(set = 0, binding = ${schema.descriptors.labPbrSpecularAtlas}) uniform sampler2D primeLabPbrSpecularAtlas;
layout(set = 0, binding = ${schema.descriptors.accumulationImage}, rgba32f) uniform image2D primeAccumulation;
layout(set = 0, binding = ${schema.descriptors.skyView}, rgba16f) uniform readonly image2D primeSkyView;
layout(set = 0, binding = ${schema.descriptors.transmittanceLow}, rgba16f) uniform readonly image2D primeTransmittanceLow;
layout(set = 0, binding = ${schema.descriptors.transmittanceHigh}, rgba16f) uniform readonly image2D primeTransmittanceHigh;
layout(set = 0, binding = ${schema.descriptors.aerialRadiance}, rgba16f) uniform readonly image3D primeAerialRadiance;
layout(set = 0, binding = ${schema.descriptors.aerialTransmittance}, rgba16f) uniform readonly image3D primeAerialTransmittance;
// NRD is part of the integrator boundary. Raygen first writes private raw signals to a subset of
// these images; nrd_motion.comp converts them in place to demodulated scene-linear Rec.2020
// radiance and matching primary guides before NRD reads them. Changing the final encoding, units
// or previous-minus-current motion sign silently invalidates reprojection and edge stopping.
layout(set = 0, binding = ${schema.descriptors.nrdNoisyDiffuse}, rgba16f) uniform image2D primeNrdNoisyDiffuse;
layout(set = 0, binding = ${schema.descriptors.nrdNoisySpecular}, rgba16f) uniform image2D primeNrdNoisySpecular;
layout(set = 0, binding = ${schema.descriptors.nrdNormalRoughness}, rgb10_a2) uniform image2D primeNrdNormalRoughness;
layout(set = 0, binding = ${schema.descriptors.nrdViewZ}, r32f) uniform image2D primeNrdViewZ;
layout(set = 0, binding = ${schema.descriptors.nrdMotion}, rgba16f) uniform image2D primeNrdMotion;
layout(set = 0, binding = ${schema.descriptors.nrdMaterial}, rgba16f) uniform image2D primeNrdMaterial;
layout(set = 0, binding = ${schema.descriptors.nrdSpecularMaterial}, rgba16f) uniform image2D primeNrdSpecularMaterial;
layout(set = 0, binding = ${schema.descriptors.nrdPrimaryPosition}, rgba32f) uniform image2D primeNrdPrimaryPosition;
// Transparent transport is deliberately composed after opaque NRD. These are not NRD signals:
// they are the scene-referred output and the semantic masks consumed by FSR's temporal stage.
layout(set = 0, binding = ${schema.descriptors.sceneColor}, rgba16f) uniform image2D primeSceneColor;
layout(set = 0, binding = ${schema.descriptors.fsrReactiveMask}, r8) uniform image2D primeFsrReactiveMask;
layout(set = 0, binding = ${schema.descriptors.fsrTransparencyCompositionMask}, r8) uniform image2D primeFsrTransparencyCompositionMask;
// A transparent first interface produces two unrelated virtual surfaces. Each group below belongs
// to one independent diffuse/specular NRD instance. Do not merge or swap them: sharing guide/history
// state between reflected and transmitted transport creates invalid temporal correspondences.
layout(set = 0, binding = ${schema.descriptors.transparentReflectionNoisy}, rgba16f) uniform image2D primeTransparentReflectionNoisy;
layout(set = 0, binding = ${schema.descriptors.transparentReflectionPosition}, rgba32f) uniform image2D primeTransparentReflectionPosition;
layout(set = 0, binding = ${schema.descriptors.transparentReflectionMetadata}, rgba16f) uniform image2D primeTransparentReflectionMetadata;
layout(set = 0, binding = ${schema.descriptors.transparentReflectionGuide}, rgba16f) uniform image2D primeTransparentReflectionGuide;
layout(set = 0, binding = ${schema.descriptors.transparentTransmissionNoisy}, rgba16f) uniform image2D primeTransparentTransmissionNoisy;
layout(set = 0, binding = ${schema.descriptors.transparentTransmissionPosition}, rgba32f) uniform image2D primeTransparentTransmissionPosition;
layout(set = 0, binding = ${schema.descriptors.transparentTransmissionMetadata}, rgba16f) uniform image2D primeTransparentTransmissionMetadata;
layout(set = 0, binding = ${schema.descriptors.transparentTransmissionGuide}, rgba16f) uniform image2D primeTransparentTransmissionGuide;
// The rgba32 position stores the current virtual surface relative to the effective camera. The
// paired rgba16 image stores previous-minus-current virtual position. Raygen reduces the entire
// delta chain to this pair so the persistent per-pixel ABI stays independent of chain capacity.
layout(set = 0, binding = ${schema.descriptors.transparentReflectionInterface}, rgba16f) uniform image2D primeTransparentReflectionInterface;
layout(set = 0, binding = ${schema.descriptors.transparentTransmissionInterface}, rgba16f) uniform image2D primeTransparentTransmissionInterface;
layout(set = 0, binding = ${schema.descriptors.transparentReflectionSpecular}, rgba16f) uniform image2D primeTransparentReflectionSpecular;
layout(set = 0, binding = ${schema.descriptors.transparentTransmissionSpecular}, rgba16f) uniform image2D primeTransparentTransmissionSpecular;
layout(set = 0, binding = ${schema.descriptors.transparentReflectionThroughput}, rgba16f) uniform image2D primeTransparentReflectionThroughput;
layout(set = 0, binding = ${schema.descriptors.transparentTransmissionThroughput}, rgba16f) uniform image2D primeTransparentTransmissionThroughput;
// xyz is the previous effective camera in the same render-origin-relative coordinates as ray
// traversal. w is zero when temporal history is being reset. This buffer cannot be folded into the
// 128-byte push block without exceeding Prime's minimum-device push-constant contract.
layout(std140, set = 0, binding = ${schema.descriptors.temporalCamera}) uniform PrimeTemporalCamera {
    vec4 previousCameraValid;
} primeTemporalCamera;

#endif
"""
		new File(glslDir, 'prime_atmosphere_contract.glsl').text = """\
#ifndef PRIME_ATMOSPHERE_CONTRACT_GLSL
#define PRIME_ATMOSPHERE_CONTRACT_GLSL

// Generated from shaders/abi.json. Atmosphere compute and ray tracing must share these values.
#define PRIME_ATMOSPHERE_BOTTOM_RADIUS_KM ${atmosphereContract.bottomRadiusKm}
#define PRIME_ATMOSPHERE_TOP_RADIUS_KM ${atmosphereContract.topRadiusKm}
#define PRIME_ATMOSPHERE_WORLD_SEA_LEVEL_Y ${atmosphereContract.worldSeaLevelY}
#define PRIME_ATMOSPHERE_WORLD_UNIT_SCALE_KM ${atmosphereContract.worldUnitScaleKm}
#define PRIME_ATMOSPHERE_SPACE_SUN_INTENSITY ${atmosphereContract.spaceSunIntensity}
#define PRIME_ATMOSPHERE_SUN_ANGULAR_RADIUS_RADIANS ${atmosphereContract.sunAngularRadiusRadians}
#define PRIME_ATMOSPHERE_AERIAL_MAX_DISTANCE_KM ${atmosphereContract.aerialMaxDistanceKm}

#endif
"""
		new File(glslDir, 'prime_color_contract.glsl').text = """\
#ifndef PRIME_COLOR_CONTRACT_GLSL
#define PRIME_COLOR_CONTRACT_GLSL

// Generated from shaders/abi.json. FSR and the display transform must share this exposure.
#define PRIME_COLOR_WORKING_SPACE_LINEAR_REC2020_D65 1
#define PRIME_COLOR_TEXTURE_ENCODING_SRGB 1
#define PRIME_COLOR_DISPLAY_ENCODING_SRGB 1
#define PRIME_COLOR_DISPLAY_SPACE_REC709_D65 1
#define PRIME_COLOR_DISPLAY_TRANSFORM_OKLAB_DRT 1
#define PRIME_DISPLAY_EXPOSURE ${colorContract.displayExposure}

#endif
"""
	}
}

abstract class CompilePrimeShaders extends DefaultTask {
	@InputDirectory
	abstract DirectoryProperty getSourceDirectory()

	@InputDirectory
	abstract DirectoryProperty getIncludeDirectory()

	@OutputDirectory
	abstract DirectoryProperty getOutputDirectory()

	@Input
	abstract Property<String> getGlslangValidator()

	@Input
	abstract Property<String> getSpirvValidator()

	@javax.inject.Inject
	abstract org.gradle.process.ExecOperations getExecOperations()

	@javax.inject.Inject
	abstract org.gradle.api.file.FileSystemOperations getFileSystemOperations()

	@TaskAction
	void compile() {
		def sources = sourceDirectory.get().asFileTree.matching {
			include '**/*.rgen', '**/*.rmiss', '**/*.rchit', '**/*.rahit', '**/*.comp'
		}.files.sort { it.absolutePath }
		if (sources.empty) {
			throw new GradleException('No Prime Vulkan shaders were found')
		}

		def scratch = new File(temporaryDir, 'spv')
		fileSystemOperations.delete { delete scratch }
		scratch.mkdirs()
		sources.each { source ->
			def output = new File(scratch, source.name + '.spv')
			execOperations.exec {
				commandLine glslangValidator.get(), '-V', '--target-env', 'vulkan1.2', '-g',
						"-I${includeDirectory.get().asFile.absolutePath}", source.absolutePath,
						'-o', output.absolutePath
			}
			execOperations.exec {
				commandLine spirvValidator.get(), '--target-env', 'vulkan1.2', output.absolutePath
			}
			// Conformance-only shaders force otherwise dormant libraries through glslang and
			// spirv-val, but are never loaded at runtime and must not inflate the distributable jar.
			if (source.name.endsWith('_validation.comp')) {
				java.nio.file.Files.delete(output.toPath())
			}
			if (source.name == 'world.rgen') {
				// Keep a baseline module that never declares the optional extension and a separate
				// SER permutation for devices that negotiate real invocation reordering. Runtime
				// selection therefore cannot expose unsupported SPIR-V to a fallback device.
				def serOutput = new File(scratch, 'world_ser.rgen.spv')
				execOperations.exec {
					commandLine glslangValidator.get(), '-V', '--target-env', 'vulkan1.2', '-g',
							'-DPRIME_ENABLE_SER=1',
							"-I${includeDirectory.get().asFile.absolutePath}", source.absolutePath,
							'-o', serOutput.absolutePath
				}
				execOperations.exec {
					commandLine spirvValidator.get(), '--target-env', 'vulkan1.2', serOutput.absolutePath
				}
			}
		}

		def published = new File(outputDirectory.get().asFile, 'prime/shaders')
		fileSystemOperations.delete { delete published }
		published.mkdirs()
		scratch.listFiles().each { source ->
			java.nio.file.Files.move(source.toPath(), new File(published, source.name).toPath(),
					java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		}
	}
}

def resolveVulkanTool = { String name ->
	def windows = System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).contains('win')
	def extension = windows ? '.exe' : ''
	def sdk = System.getenv('VULKAN_SDK')
	if (sdk) {
		def binDirectories = windows ? ['Bin', 'bin'] : ['bin', 'Bin']
		for (def binDirectory : binDirectories) {
			def candidate = file("${sdk}/${binDirectory}/${name}${extension}")
			if (candidate.exists()) {
				return candidate.absolutePath
			}
		}
	}
	return "${name}${extension}"
}

def generateShaderAbi = tasks.register('generateShaderAbi', GenerateShaderAbi) {
	schemaFile = file('shaders/abi.json')
	javaOutputDirectory = shaderAbiJavaRoot
	glslOutputDirectory = shaderAbiIncludeRoot
}

def compileShaders = tasks.register('compileShaders', CompilePrimeShaders) {
	dependsOn generateShaderAbi
	sourceDirectory = file('shaders')
	includeDirectory = shaderAbiIncludeRoot
	outputDirectory = compiledShaderRoot
	glslangValidator = resolveVulkanTool('glslangValidator')
	spirvValidator = resolveVulkanTool('spirv-val')
}

sourceSets.client.java.srcDir(files(shaderAbiJavaRoot).builtBy(generateShaderAbi))
sourceSets.client.resources.srcDir(files(compiledShaderRoot).builtBy(compileShaders))
sourceSets.test.compileClasspath += sourceSets.client.output
sourceSets.test.runtimeClasspath += sourceSets.client.output

tasks.named('compileTestJava') {
	dependsOn tasks.named('compileClientJava')
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand version: inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.compilerArgs += ['-Xlint:all', '-Werror']
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	// The NRD ABI tests intentionally load the bundled bridge through LWJGL. Declare native and
	// LWJGL legacy-memory access explicitly on Java 25, and keep JOML on its supported safe path, so
	// dependency warnings do not hide actionable test failures.
	jvmArgs '--enable-native-access=ALL-UNNAMED', '--sun-misc-unsafe-memory-access=allow'
	systemProperty 'joml.nounsafe', 'true'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

def licenseArchiveSuffix = project.name
jar {
	from('LICENSE') {
		rename { "${it}_${licenseArchiveSuffix}" }
	}
	from('THIRD_PARTY_LICENSES') {
		into 'META-INF/licenses'
	}
}

def distributionVersion = project.version.toString()
def verifyDistributionJar = tasks.register('verifyDistributionJar') {
	group = 'verification'
	description = 'Verifies that the distributable jar contains every runtime dependency.'
	dependsOn tasks.named('jar')
	def archiveProvider = tasks.named('jar', Jar).flatMap { it.archiveFile }
	inputs.file(archiveProvider)

	doLast {
		def archive = archiveProvider.get().asFile
		def names = new LinkedHashSet<String>()
		def duplicateNames = new LinkedHashSet<String>()
		new java.util.zip.ZipFile(archive).withCloseable { zip ->
			def entries = zip.entries()
			while (entries.hasMoreElements()) {
				def name = entries.nextElement().name
				if (!names.add(name)) {
					duplicateNames.add(name)
				}
			}
		}
		if (!duplicateNames.isEmpty()) {
			throw new GradleException("Distribution jar contains duplicate entries: ${duplicateNames}")
		}

		def required = [
			'fabric.mod.json',
			'prime.mixins.json',
			'prime.accesswidener',
			'LICENSE_prime',
			'META-INF/licenses/README.md',
			'META-INF/licenses/APACHE-2.0.txt',
			'META-INF/licenses/FIDELITYFX-SDK-LICENSE.txt',
			'META-INF/licenses/NRD-LICENSE.txt',
			'META-INF/licenses/ROBOCUTE-NOTICE.txt',
			'prime/natives/windows-x86_64/prime_nrd.dll',
			'prime/natives/windows-x86_64/amd_fidelityfx_vk.dll',
			'prime/shaders/world.rgen.spv',
			'prime/shaders/world_ser.rgen.spv',
			'prime/shaders/transparent.rgen.spv',
			'prime/shaders/screenshot.rgen.spv',
			'prime/shaders/screenshot_display.comp.spv',
			'prime/shaders/nrd_motion.comp.spv',
			'prime/shaders/nrd_transparent_motion.comp.spv',
			'prime/shaders/fsr_display.comp.spv'
		]
		def missing = required.findAll { !names.contains(it) }
		if (!missing.isEmpty()) {
			throw new GradleException("Distribution jar is missing runtime entries: ${missing}")
		}

		def shaderNames = names.findAll { it.startsWith('prime/shaders/') && it.endsWith('.spv') }
		if (shaderNames.size() != 19) {
			throw new GradleException(
					"Distribution jar must contain 19 Prime shaders; found ${shaderNames.size()}")
		}

		new java.util.zip.ZipFile(archive).withCloseable { zip ->
			def metadataInput = zip.getInputStream(zip.getEntry('fabric.mod.json'))
			def metadata = metadataInput.withCloseable { new groovy.json.JsonSlurper().parse(it) }
			if (metadata.id != 'prime'
					|| metadata.version.toString() != distributionVersion
					|| metadata.environment != 'client') {
				throw new GradleException(
						"Distribution jar has invalid Fabric metadata: id=${metadata.id}, "
								+ "version=${metadata.version}, environment=${metadata.environment}")
			}

			def nativeInput = zip.getInputStream(zip.getEntry('prime/natives/windows-x86_64/prime_nrd.dll'))
			def nativeHeader = nativeInput.withCloseable { it.readNBytes(2) }
			if (nativeHeader.length != 2 || nativeHeader[0] != (byte) 'M' || nativeHeader[1] != (byte) 'Z') {
				throw new GradleException('Bundled NRD bridge is not a Windows PE image')
			}
			def fsrNativeInput = zip.getInputStream(
					zip.getEntry('prime/natives/windows-x86_64/amd_fidelityfx_vk.dll'))
			def fsrNativeHeader = fsrNativeInput.withCloseable { it.readNBytes(2) }
			if (fsrNativeHeader.length != 2
					|| fsrNativeHeader[0] != (byte) 'M'
					|| fsrNativeHeader[1] != (byte) 'Z') {
				throw new GradleException('Bundled FidelityFX library is not a Windows PE image')
			}

			def invalidSpirv = shaderNames.findAll { shaderName ->
				def input = zip.getInputStream(zip.getEntry(shaderName))
				def header = input.withCloseable { it.readNBytes(Integer.BYTES) }
				header.length != Integer.BYTES
						|| java.nio.ByteBuffer.wrap(header)
								.order(java.nio.ByteOrder.LITTLE_ENDIAN)
								.getInt() != 0x07230203
			}
			if (!invalidSpirv.isEmpty()) {
				throw new GradleException("Distribution jar contains invalid SPIR-V files: ${invalidSpirv}")
			}
		}
		def forbidden = names.findAll {
			it.contains('_validation')
					|| it ==~ /.*\.(glsl|rgen|rchit|rmiss|rahit|comp)$/
		}
		if (!forbidden.isEmpty()) {
			throw new GradleException("Distribution jar contains build-only shader inputs: ${forbidden}")
		}
	}
}

tasks.named('check') {
	dependsOn verifyDistributionJar
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}
}
