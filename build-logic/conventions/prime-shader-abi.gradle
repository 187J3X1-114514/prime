    public static final int LIGHT_NODE_FORWARD_SIZE = ${lightNodeForward.size};
    public static final int LIGHT_NODE_REVERSE_SIZE = ${lightNodeReverse.size};
    public static final int LIGHT_EMITTER_SIZE = ${lightEmitter.size};
