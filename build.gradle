plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

def developmentGraphicsBackend = providers.gradleProperty('primeBackend').orElse('vulkan')

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		prime {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			client()
			setConfigName('Prime Vulkan Client')
			ideConfigGenerated = true
			runDir = 'run'
			def selectedBackend = developmentGraphicsBackend.get().toLowerCase(java.util.Locale.ROOT)
			if (selectedBackend != 'vulkan' && selectedBackend != 'opengl') {
				throw new GradleException("primeBackend must be either 'vulkan' or 'opengl'")
			}
			programArgs '--graphicsBackend', selectedBackend
			if (selectedBackend == 'vulkan') {
				programArgs '--vulkanValidation'
			}
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform('org.junit:junit-bom:6.0.3')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def shaderAbiJavaRoot = layout.buildDirectory.dir('generated/sources/shaderAbi/java')
def shaderAbiIncludeRoot = layout.buildDirectory.dir('generated/sources/shaderAbi/glsl')
def compiledShaderRoot = layout.buildDirectory.dir('generated/resources/shaders')
def compiledFsrShaderRoot = layout.buildDirectory.dir('generated/resources/fsrShaders')

abstract class GenerateShaderAbi extends DefaultTask {
	@InputFile
	abstract RegularFileProperty getSchemaFile()

	@OutputDirectory
	abstract DirectoryProperty getJavaOutputDirectory()

	@OutputDirectory
	abstract DirectoryProperty getGlslOutputDirectory()

	@TaskAction
	void generate() {
		def schema = new groovy.json.JsonSlurper().parse(schemaFile.get().asFile)
		def primitive = schema.structs.primitiveRecord
		def section = schema.structs.sectionRecord
		def lightNode = schema.structs.lightNode
		def lightEmitter = schema.structs.lightEmitter
		def lightCell = schema.structs.lightCell
		def sectionLightHeader = schema.structs.sectionLightHeader
		def integrator = schema.structs.integratorRecord
		def pathState = schema.structs.pathState
		def tracePayload = schema.structs.tracePayload
		def surfaceInteraction = schema.structs.surfaceInteraction
		def push = schema.structs.pushConstants
		def colorContract = schema.colorContract
		def atmosphereContract = schema.atmosphereContract
		def nrdContract = schema.nrdContract

		if (primitive.size != 32 || section.size != 64 || lightNode.size != 48
				|| lightEmitter.size != 96 || lightCell.size != 16 || sectionLightHeader.size != 32
				|| integrator.size != 32 || pathState.size != 96 || tracePayload.size != 64
				|| surfaceInteraction.size != 64 || push.size != 128) {
			throw new GradleException('Prime shader ABI sizes changed without a coordinated migration')
		}
		if (colorContract.workingSpace != 'linear-rec2020-d65'
				|| colorContract.textureEncoding != 'srgb'
				|| colorContract.displayEncoding != 'srgb'
				|| colorContract.displayColorSpace != 'rec709-d65'
				|| colorContract.defaultDisplayTransform != 'oklab-drt'
				|| colorContract.displayExposure != 1.0) {
			throw new GradleException(
					'Prime color contract must remain sRGB input -> linear Rec.2020 D65 -> Oklab DRT -> sRGB Rec.709 display')
		}
		if (atmosphereContract.spectralModel != 'hillaire-8wave-rec2020-d65'
				|| atmosphereContract.worldSeaLevelY != -64.0
				|| atmosphereContract.worldUnitScaleKm != 0.004
				|| atmosphereContract.spaceSunIntensity != 10.0
				|| atmosphereContract.sunAngularRadiusRadians != 0.00471) {
			throw new GradleException(
					'Prime atmosphere contract must remain the eight-wave Rec.2020 model, '
							+ 'the -64 sea level / 0.004 km world scale, and a 10-unit space sun')
		}
		if (nrdContract.version != '4.17.4'
				|| nrdContract.denoiser != 'reblur-diffuse-specular'
				|| nrdContract.normalEncoding != 'r10g10b10a2-unorm'
				|| nrdContract.roughnessEncoding != 'linear'
				|| nrdContract.motionSpace != 'screen-2.5d'
				|| nrdContract.signalSpace != 'demodulated-linear-rec2020-d65') {
			throw new GradleException('Prime NRD signal and native-library contracts changed without a coordinated migration')
		}
		def typeLayout = [
			float: [size: 4, alignment: 4],
			uint: [size: 4, alignment: 4],
			uint64_t: [size: 8, alignment: 8],
			mat4: [size: 64, alignment: 16],
			vec3: [size: 12, alignment: 16],
			vec4: [size: 16, alignment: 16],
			uvec2: [size: 8, alignment: 8],
			uvec4: [size: 16, alignment: 16]
		]
		def validateStruct = { String name, def definition ->
			int cursor = 0
			int maximumAlignment = 1
			definition.fields.each { field ->
				def layout = typeLayout[field.type]
				if (layout == null) {
					throw new GradleException("Unsupported ABI field type ${field.type}")
				}
				cursor = (cursor + layout.alignment - 1).intdiv(layout.alignment) * layout.alignment
				if (field.offset != cursor) {
					throw new GradleException("${name}.${field.name} must have offset ${cursor}, found ${field.offset}")
				}
				cursor += layout.size
				maximumAlignment = Math.max(maximumAlignment, layout.alignment)
			}
			cursor = (cursor + maximumAlignment - 1).intdiv(maximumAlignment) * maximumAlignment
			if (definition.size != cursor) {
				throw new GradleException("${name} must have size ${cursor}, found ${definition.size}")
			}
		}
		validateStruct('PrimitiveRecord', primitive)
		validateStruct('SectionRecord', section)
		validateStruct('LightNode', lightNode)
		validateStruct('LightEmitter', lightEmitter)
		validateStruct('LightCell', lightCell)
		validateStruct('SectionLightHeader', sectionLightHeader)
		validateStruct('IntegratorRecord', integrator)
		validateStruct('PathState', pathState)
		validateStruct('TracePayload', tracePayload)
		validateStruct('SurfaceInteraction', surfaceInteraction)
		validateStruct('PushConstants', push)

		def constantName = { String value ->
			value.replaceAll('([a-z0-9])([A-Z])', '$1_$2').toUpperCase(java.util.Locale.ROOT)
		}
		def javaOffsets = new StringBuilder()
		[
			PRIMITIVE: primitive,
			SECTION: section,
			LIGHT_NODE: lightNode,
			LIGHT_EMITTER: lightEmitter,
			LIGHT_CELL: lightCell,
			SECTION_LIGHT_HEADER: sectionLightHeader,
			INTEGRATOR: integrator,
			PATH_STATE: pathState,
			TRACE_PAYLOAD: tracePayload,
			SURFACE: surfaceInteraction,
			PUSH: push
		].each { prefix, definition ->
			definition.fields.each { field ->
				javaOffsets.append("    public static final int ${prefix}_${constantName(field.name)}_OFFSET = ${field.offset};\n")
			}
		}
		def glslStructFields = { def definition ->
			definition.fields.collect { field -> "    ${field.type} ${field.name};" }.join('\n')
		}
		def glslPushFields = push.fields.collect { field ->
			"    layout(offset = ${field.offset}) ${field.type} ${field.name};"
		}.join('\n')

		def javaPackageDir = new File(javaOutputDirectory.get().asFile, 'dev/prime/render/shader')
		javaPackageDir.mkdirs()
		new File(javaPackageDir, 'ShaderAbi.java').text = """\
package dev.prime.render.shader;

/** Generated from shaders/abi.json. Do not edit by hand. */
public final class ShaderAbi {
    public static final int PRIMITIVE_RECORD_SIZE = ${primitive.size};
    public static final int SECTION_RECORD_SIZE = ${section.size};
    public static final int LIGHT_NODE_SIZE = ${lightNode.size};
    public static final int LIGHT_EMITTER_SIZE = ${lightEmitter.size};
    public static final int LIGHT_CELL_SIZE = ${lightCell.size};
    public static final int SECTION_LIGHT_HEADER_SIZE = ${sectionLightHeader.size};
    public static final int INTEGRATOR_RECORD_SIZE = ${integrator.size};
    public static final int PATH_STATE_SIZE = ${pathState.size};
    public static final int TRACE_PAYLOAD_SIZE = ${tracePayload.size};
    public static final int SURFACE_INTERACTION_SIZE = ${surfaceInteraction.size};
    public static final int PUSH_CONSTANT_SIZE = ${push.size};
    public static final int DESCRIPTOR_TLAS = ${schema.descriptors.tlas};
    public static final int DESCRIPTOR_OUTPUT_IMAGE = ${schema.descriptors.outputImage};
    public static final int DESCRIPTOR_BLOCK_ATLAS = ${schema.descriptors.blockAtlas};
    public static final int DESCRIPTOR_ACCUMULATION_IMAGE = ${schema.descriptors.accumulationImage};
    public static final int DESCRIPTOR_SKY_VIEW = ${schema.descriptors.skyView};
    public static final int DESCRIPTOR_TRANSMITTANCE_LOW = ${schema.descriptors.transmittanceLow};
    public static final int DESCRIPTOR_TRANSMITTANCE_HIGH = ${schema.descriptors.transmittanceHigh};
    public static final int DESCRIPTOR_AERIAL_RADIANCE = ${schema.descriptors.aerialRadiance};
    public static final int DESCRIPTOR_AERIAL_TRANSMITTANCE = ${schema.descriptors.aerialTransmittance};
    public static final int DESCRIPTOR_NRD_NOISY_DIFFUSE = ${schema.descriptors.nrdNoisyDiffuse};
    public static final int DESCRIPTOR_NRD_NORMAL_ROUGHNESS = ${schema.descriptors.nrdNormalRoughness};
    public static final int DESCRIPTOR_NRD_VIEW_Z = ${schema.descriptors.nrdViewZ};
    public static final int DESCRIPTOR_NRD_MOTION = ${schema.descriptors.nrdMotion};
    public static final int DESCRIPTOR_NRD_MATERIAL = ${schema.descriptors.nrdMaterial};
    public static final int DESCRIPTOR_NRD_PRIMARY_POSITION = ${schema.descriptors.nrdPrimaryPosition};
    public static final int DESCRIPTOR_NRD_NOISY_SPECULAR = ${schema.descriptors.nrdNoisySpecular};
    public static final int DESCRIPTOR_NRD_SPECULAR_MATERIAL = ${schema.descriptors.nrdSpecularMaterial};
    public static final float CUTOUT_ALPHA_THRESHOLD = ${schema.cutoutAlphaThreshold}f;
    public static final String WORKING_COLOR_SPACE = "${colorContract.workingSpace}";
    public static final String TEXTURE_COLOR_ENCODING = "${colorContract.textureEncoding}";
    public static final String DISPLAY_COLOR_ENCODING = "${colorContract.displayEncoding}";
    public static final String DISPLAY_COLOR_SPACE = "${colorContract.displayColorSpace}";
    public static final String DEFAULT_DISPLAY_TRANSFORM = "${colorContract.defaultDisplayTransform}";
    public static final float DISPLAY_EXPOSURE = ${colorContract.displayExposure}f;
    public static final String NRD_VERSION = "${nrdContract.version}";
    public static final String NRD_DENOISER = "${nrdContract.denoiser}";
    public static final String NRD_NORMAL_ENCODING = "${nrdContract.normalEncoding}";
    public static final String NRD_ROUGHNESS_ENCODING = "${nrdContract.roughnessEncoding}";
    public static final String NRD_MOTION_SPACE = "${nrdContract.motionSpace}";
    public static final String NRD_SIGNAL_SPACE = "${nrdContract.signalSpace}";
    public static final String ATMOSPHERE_SPECTRAL_MODEL = "${atmosphereContract.spectralModel}";
    public static final float ATMOSPHERE_BOTTOM_RADIUS_KM = ${atmosphereContract.bottomRadiusKm}f;
    public static final float ATMOSPHERE_TOP_RADIUS_KM = ${atmosphereContract.topRadiusKm}f;
    public static final float ATMOSPHERE_WORLD_SEA_LEVEL_Y = ${atmosphereContract.worldSeaLevelY}f;
    public static final float ATMOSPHERE_WORLD_UNIT_SCALE_KM = ${atmosphereContract.worldUnitScaleKm}f;
    public static final float ATMOSPHERE_SPACE_SUN_INTENSITY = ${atmosphereContract.spaceSunIntensity}f;
    public static final float ATMOSPHERE_SUN_ANGULAR_RADIUS_RADIANS = ${atmosphereContract.sunAngularRadiusRadians}f;
    public static final float ATMOSPHERE_AERIAL_MAX_DISTANCE_KM = ${atmosphereContract.aerialMaxDistanceKm}f;
${javaOffsets}

    private ShaderAbi() {
    }
}
"""

		def glslDir = glslOutputDirectory.get().asFile
		glslDir.mkdirs()
		new File(glslDir, 'prime_abi.glsl').text = """\
#ifndef PRIME_ABI_GLSL
#define PRIME_ABI_GLSL

#extension GL_EXT_ray_tracing : require
#extension GL_EXT_buffer_reference2 : require
#extension GL_EXT_shader_explicit_arithmetic_types_int64 : require

#include "prime_color_contract.glsl"

#define PRIME_PRIMITIVE_RECORD_SIZE ${primitive.size}
#define PRIME_SECTION_RECORD_SIZE ${section.size}
#define PRIME_LIGHT_NODE_SIZE ${lightNode.size}
#define PRIME_LIGHT_EMITTER_SIZE ${lightEmitter.size}
#define PRIME_LIGHT_CELL_SIZE ${lightCell.size}
#define PRIME_SECTION_LIGHT_HEADER_SIZE ${sectionLightHeader.size}
#define PRIME_INTEGRATOR_RECORD_SIZE ${integrator.size}
#define PRIME_PATH_STATE_SIZE ${pathState.size}
#define PRIME_TRACE_PAYLOAD_SIZE ${tracePayload.size}
#define PRIME_SURFACE_INTERACTION_SIZE ${surfaceInteraction.size}
#define PRIME_PUSH_CONSTANT_SIZE ${push.size}
#define PRIME_CUTOUT_ALPHA_THRESHOLD ${schema.cutoutAlphaThreshold}
struct PrimitiveRecord {
${glslStructFields(primitive)}
};

struct SectionRecord {
${glslStructFields(section)}
};

struct LightNode {
${glslStructFields(lightNode)}
};

struct LightEmitter {
${glslStructFields(lightEmitter)}
};

struct LightCell {
${glslStructFields(lightCell)}
};

struct SectionLightHeader {
${glslStructFields(sectionLightHeader)}
};

// These explicit records deliberately contain no execution-local state. They can be moved to
// storage-buffer queues by a future wavefront scheduler without changing integrator semantics.
// Every color or radiance field in these records is linear Rec.2020 D65. This is part of the
// estimator ABI, not a presentation choice; changing it requires a coordinated ABI migration.
struct IntegratorRecord {
${glslStructFields(integrator)}
};

struct PathState {
${glslStructFields(pathState)}
};

struct TracePayload {
${glslStructFields(tracePayload)}
};

struct SurfaceInteraction {
${glslStructFields(surfaceInteraction)}
};

layout(buffer_reference, buffer_reference_align = 8) readonly buffer PrimitiveBuffer {
    PrimitiveRecord records[];
};

layout(buffer_reference, buffer_reference_align = 8) readonly buffer SectionTable {
    SectionRecord sections[];
};

layout(buffer_reference, buffer_reference_align = 16) readonly buffer LightNodeBuffer {
    LightNode nodes[];
};

layout(buffer_reference, buffer_reference_align = 16) readonly buffer LightEmitterBuffer {
    LightEmitter emitters[];
};

layout(buffer_reference, buffer_reference_align = 16) readonly buffer LightCellBuffer {
    LightCell cells[];
};

layout(buffer_reference, buffer_reference_align = 8) readonly buffer SectionLightHeaderBuffer {
    SectionLightHeader header;
};

layout(buffer_reference, buffer_reference_align = 16) readonly buffer IntegratorBuffer {
    IntegratorRecord record;
};

layout(push_constant) uniform PrimePushConstants {
${glslPushFields}
} primePush;

layout(set = 0, binding = ${schema.descriptors.tlas}) uniform accelerationStructureEXT primeScene;
layout(set = 0, binding = ${schema.descriptors.outputImage}, rgba8) uniform image2D primeOutput;
layout(set = 0, binding = ${schema.descriptors.blockAtlas}) uniform sampler2D primeBlockAtlas;
layout(set = 0, binding = ${schema.descriptors.accumulationImage}, rgba32f) uniform image2D primeAccumulation;
layout(set = 0, binding = ${schema.descriptors.skyView}, rgba16f) uniform readonly image2D primeSkyView;
layout(set = 0, binding = ${schema.descriptors.transmittanceLow}, rgba16f) uniform readonly image2D primeTransmittanceLow;
layout(set = 0, binding = ${schema.descriptors.transmittanceHigh}, rgba16f) uniform readonly image2D primeTransmittanceHigh;
layout(set = 0, binding = ${schema.descriptors.aerialRadiance}, rgba16f) uniform readonly image3D primeAerialRadiance;
layout(set = 0, binding = ${schema.descriptors.aerialTransmittance}, rgba16f) uniform readonly image3D primeAerialTransmittance;
// NRD is part of the integrator boundary. Raygen first writes private raw signals to a subset of
// these images; nrd_motion.comp converts them in place to demodulated scene-linear Rec.2020
// radiance and matching primary guides before NRD reads them. Changing the final encoding, units
// or previous-minus-current motion sign silently invalidates reprojection and edge stopping.
layout(set = 0, binding = ${schema.descriptors.nrdNoisyDiffuse}, rgba16f) uniform image2D primeNrdNoisyDiffuse;
layout(set = 0, binding = ${schema.descriptors.nrdNoisySpecular}, rgba16f) uniform image2D primeNrdNoisySpecular;
layout(set = 0, binding = ${schema.descriptors.nrdNormalRoughness}, rgb10_a2) uniform image2D primeNrdNormalRoughness;
layout(set = 0, binding = ${schema.descriptors.nrdViewZ}, r32f) uniform image2D primeNrdViewZ;
layout(set = 0, binding = ${schema.descriptors.nrdMotion}, rgba16f) uniform image2D primeNrdMotion;
layout(set = 0, binding = ${schema.descriptors.nrdMaterial}, rgba16f) uniform image2D primeNrdMaterial;
layout(set = 0, binding = ${schema.descriptors.nrdSpecularMaterial}, rgba16f) uniform image2D primeNrdSpecularMaterial;
layout(set = 0, binding = ${schema.descriptors.nrdPrimaryPosition}, rgba32f) uniform image2D primeNrdPrimaryPosition;

#endif
"""
		new File(glslDir, 'prime_atmosphere_contract.glsl').text = """\
#ifndef PRIME_ATMOSPHERE_CONTRACT_GLSL
#define PRIME_ATMOSPHERE_CONTRACT_GLSL

// Generated from shaders/abi.json. Atmosphere compute and ray tracing must share these values.
#define PRIME_ATMOSPHERE_BOTTOM_RADIUS_KM ${atmosphereContract.bottomRadiusKm}
#define PRIME_ATMOSPHERE_TOP_RADIUS_KM ${atmosphereContract.topRadiusKm}
#define PRIME_ATMOSPHERE_WORLD_SEA_LEVEL_Y ${atmosphereContract.worldSeaLevelY}
#define PRIME_ATMOSPHERE_WORLD_UNIT_SCALE_KM ${atmosphereContract.worldUnitScaleKm}
#define PRIME_ATMOSPHERE_SPACE_SUN_INTENSITY ${atmosphereContract.spaceSunIntensity}
#define PRIME_ATMOSPHERE_SUN_ANGULAR_RADIUS_RADIANS ${atmosphereContract.sunAngularRadiusRadians}
#define PRIME_ATMOSPHERE_AERIAL_MAX_DISTANCE_KM ${atmosphereContract.aerialMaxDistanceKm}

#endif
"""
		new File(glslDir, 'prime_color_contract.glsl').text = """\
#ifndef PRIME_COLOR_CONTRACT_GLSL
#define PRIME_COLOR_CONTRACT_GLSL

// Generated from shaders/abi.json. FSR and the display transform must share this exposure.
#define PRIME_COLOR_WORKING_SPACE_LINEAR_REC2020_D65 1
#define PRIME_COLOR_TEXTURE_ENCODING_SRGB 1
#define PRIME_COLOR_DISPLAY_ENCODING_SRGB 1
#define PRIME_COLOR_DISPLAY_SPACE_REC709_D65 1
#define PRIME_COLOR_DISPLAY_TRANSFORM_OKLAB_DRT 1
#define PRIME_DISPLAY_EXPOSURE ${colorContract.displayExposure}

#endif
"""
	}
}

abstract class CompilePrimeShaders extends DefaultTask {
	@InputDirectory
	abstract DirectoryProperty getSourceDirectory()

	@InputDirectory
	abstract DirectoryProperty getIncludeDirectory()

	@OutputDirectory
	abstract DirectoryProperty getOutputDirectory()

	@Input
	abstract Property<String> getGlslangValidator()

	@Input
	abstract Property<String> getSpirvValidator()

	@javax.inject.Inject
	abstract org.gradle.process.ExecOperations getExecOperations()

	@javax.inject.Inject
	abstract org.gradle.api.file.FileSystemOperations getFileSystemOperations()

	@TaskAction
	void compile() {
		def sources = sourceDirectory.get().asFileTree.matching {
			include '**/*.rgen', '**/*.rmiss', '**/*.rchit', '**/*.rahit', '**/*.comp'
		}.files.sort { it.absolutePath }
		if (sources.empty) {
			throw new GradleException('No Prime Vulkan shaders were found')
		}

		def scratch = new File(temporaryDir, 'spv')
		fileSystemOperations.delete { delete scratch }
		scratch.mkdirs()
		sources.each { source ->
			def output = new File(scratch, source.name + '.spv')
			execOperations.exec {
				commandLine glslangValidator.get(), '-V', '--target-env', 'vulkan1.2', '-g',
						"-I${includeDirectory.get().asFile.absolutePath}", source.absolutePath,
						'-o', output.absolutePath
			}
			execOperations.exec {
				commandLine spirvValidator.get(), '--target-env', 'vulkan1.2', output.absolutePath
			}
			// Conformance-only shaders force otherwise dormant libraries through glslang and
			// spirv-val, but are never loaded at runtime and must not inflate the distributable jar.
			if (source.name.endsWith('_validation.comp')) {
				java.nio.file.Files.delete(output.toPath())
			}
			if (source.name == 'world.rgen') {
				// Keep a baseline module that never declares the optional extension and a separate
				// SER permutation for devices that negotiate real invocation reordering. Runtime
				// selection therefore cannot expose unsupported SPIR-V to a fallback device.
				def serOutput = new File(scratch, 'world_ser.rgen.spv')
				execOperations.exec {
					commandLine glslangValidator.get(), '-V', '--target-env', 'vulkan1.2', '-g',
							'-DPRIME_ENABLE_SER=1',
							"-I${includeDirectory.get().asFile.absolutePath}", source.absolutePath,
							'-o', serOutput.absolutePath
				}
				execOperations.exec {
					commandLine spirvValidator.get(), '--target-env', 'vulkan1.2', serOutput.absolutePath
				}
			}
		}

		def published = new File(outputDirectory.get().asFile, 'prime/shaders')
		fileSystemOperations.delete { delete published }
		published.mkdirs()
		scratch.listFiles().each { source ->
			java.nio.file.Files.move(source.toPath(), new File(published, source.name).toPath(),
					java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		}
	}
}

abstract class CompileFsrShaders extends DefaultTask {
	@InputDirectory
	abstract DirectoryProperty getVendorDirectory()

	@OutputDirectory
	abstract DirectoryProperty getOutputDirectory()

	@Input
	abstract Property<String> getGlslangValidator()

	@Input
	abstract Property<String> getSpirvValidator()

	@javax.inject.Inject
	abstract org.gradle.process.ExecOperations getExecOperations()

	@javax.inject.Inject
	abstract org.gradle.api.file.FileSystemOperations getFileSystemOperations()

	@TaskAction
	void compile() {
		def root = vendorDirectory.get().asFile
		def passes = new File(root, 'passes').listFiles({ file ->
			file.name.endsWith('_pass.glsl')
		} as FileFilter).sort { it.name }
		if (passes.size() != 9) {
			throw new GradleException("Prime requires the eight FSR upscaler passes plus its debug view, found ${passes.size()}")
		}

		// Build deterministic FP32 and FP16 permutations into every jar. Runtime capability
		// negotiation selects FP16 only when Vulkan exposes both shaderFloat16 and 16-bit storage;
		// neither the build machine nor the GPU vendor can silently alter the fallback path.
		def definitions = [
			'-DFFX_GPU=1',
			'-DFFX_GLSL=1',
			'-DFFX_FSR3UPSCALER_OPTION_UPSAMPLE_SAMPLERS_USE_DATA_HALF=0',
			'-DFFX_FSR3UPSCALER_OPTION_ACCUMULATE_SAMPLERS_USE_DATA_HALF=0',
			'-DFFX_FSR3UPSCALER_OPTION_REPROJECT_SAMPLERS_USE_DATA_HALF=1',
			'-DFFX_FSR3UPSCALER_OPTION_POSTPROCESSLOCKSTATUS_SAMPLERS_USE_DATA_HALF=0',
			'-DFFX_FSR3UPSCALER_OPTION_UPSAMPLE_USE_LANCZOS_TYPE=2',
			'-DFFX_FSR3UPSCALER_OPTION_REPROJECT_USE_LANCZOS_TYPE=0',
			'-DFFX_FSR3UPSCALER_OPTION_HDR_COLOR_INPUT=1',
			'-DFFX_FSR3UPSCALER_OPTION_LOW_RESOLUTION_MOTION_VECTORS=1',
			'-DFFX_FSR3UPSCALER_OPTION_JITTERED_MOTION_VECTORS=0',
			'-DFFX_FSR3UPSCALER_OPTION_INVERTED_DEPTH=1',
			'-DFFX_FSR3UPSCALER_OPTION_APPLY_SHARPENING=1'
		]
		def scratch = new File(temporaryDir, 'spv')
		fileSystemOperations.delete { delete scratch }
		scratch.mkdirs()
		['fp32': '0', 'fp16': '1'].each { variant, half ->
			def variantDirectory = new File(scratch, variant)
			variantDirectory.mkdirs()
			passes.each { source ->
				def stem = source.name.substring(0, source.name.length() - '_pass.glsl'.length())
				def output = new File(variantDirectory, stem + '.comp.spv')
				execOperations.exec {
					commandLine([glslangValidator.get(), '-V', '--target-env', 'vulkan1.2', '-S', 'comp', '-g',
							"-I${new File(root, 'FidelityFX/gpu').absolutePath}",
							"-I${root.absolutePath}", "-DFFX_HALF=${half}"] + definitions
							+ [source.absolutePath, '-o', output.absolutePath])
				}
				execOperations.exec {
					commandLine spirvValidator.get(), '--target-env', 'vulkan1.2', output.absolutePath
				}
			}
		}

		def published = new File(outputDirectory.get().asFile, 'prime/shaders/fsr3')
		fileSystemOperations.delete { delete published }
		published.mkdirs()
		scratch.listFiles().each { variant ->
			def destination = new File(published, variant.name)
			destination.mkdirs()
			variant.listFiles().each { source ->
				java.nio.file.Files.move(source.toPath(), new File(destination, source.name).toPath(),
						java.nio.file.StandardCopyOption.REPLACE_EXISTING)
			}
		}
	}
}

def resolveVulkanTool = { String name ->
	def extension = System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).contains('win') ? '.exe' : ''
	def sdk = System.getenv('VULKAN_SDK')
	if (sdk) {
		def candidate = file("${sdk}/Bin/${name}${extension}")
		if (candidate.exists()) {
			return candidate.absolutePath
		}
	}
	return "${name}${extension}"
}

def generateShaderAbi = tasks.register('generateShaderAbi', GenerateShaderAbi) {
	schemaFile = file('shaders/abi.json')
	javaOutputDirectory = shaderAbiJavaRoot
	glslOutputDirectory = shaderAbiIncludeRoot
}

def compileShaders = tasks.register('compileShaders', CompilePrimeShaders) {
	dependsOn generateShaderAbi
	sourceDirectory = file('shaders')
	includeDirectory = shaderAbiIncludeRoot
	outputDirectory = compiledShaderRoot
	glslangValidator = resolveVulkanTool('glslangValidator')
	spirvValidator = resolveVulkanTool('spirv-val')
}

def compileFsrShaders = tasks.register('compileFsrShaders', CompileFsrShaders) {
	vendorDirectory = file('shaders/vendor/fidelityfx')
	outputDirectory = compiledFsrShaderRoot
	glslangValidator = resolveVulkanTool('glslangValidator')
	spirvValidator = resolveVulkanTool('spirv-val')
}

sourceSets.client.java.srcDir(files(shaderAbiJavaRoot).builtBy(generateShaderAbi))
sourceSets.client.resources.srcDir(files(compiledShaderRoot).builtBy(compileShaders))
sourceSets.client.resources.srcDir(files(compiledFsrShaderRoot).builtBy(compileFsrShaders))
sourceSets.test.compileClasspath += sourceSets.client.output
sourceSets.test.runtimeClasspath += sourceSets.client.output

tasks.named('compileTestJava') {
	dependsOn tasks.named('compileClientJava')
}

processResources {
