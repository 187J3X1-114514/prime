abstract class CompilePrimeShaders extends DefaultTask {
	@InputDirectory
	abstract DirectoryProperty getSourceDirectory()

	@InputDirectory
	abstract DirectoryProperty getIncludeDirectory()

	@OutputDirectory
	abstract DirectoryProperty getOutputDirectory()

	@Input
	abstract Property<String> getGlslangValidator()

	@Input
	abstract Property<String> getSpirvValidator()

	@Input
	abstract Property<String> getSpirvOptimizer()

	@Input
	abstract Property<Boolean> getDebugInfo()

	@javax.inject.Inject
	abstract org.gradle.process.ExecOperations getExecOperations()

	@javax.inject.Inject
	abstract org.gradle.api.file.FileSystemOperations getFileSystemOperations()

	@TaskAction
	void compile() {
		def sources = sourceDirectory.get().asFileTree.matching {
			include '**/*.rgen', '**/*.rmiss', '**/*.rchit', '**/*.rahit', '**/*.comp'
		}.files.sort { it.absolutePath }
		if (sources.empty) {
			throw new GradleException('No Prime Vulkan shaders were found')
		}

		def scratch = new File(temporaryDir, 'spv')
		fileSystemOperations.delete { delete scratch }
		scratch.mkdirs()
		def compileShader = { File source, File output, List<String> definitions ->
			def arguments = ['-V', '--target-env', 'vulkan1.2',
					debugInfo.get() ? '-g' : '-g0']
			arguments.addAll(definitions)
			arguments.add("-I${includeDirectory.get().asFile.absolutePath}")
			arguments.add(source.absolutePath)
			arguments.addAll(['-o', output.absolutePath])
			execOperations.exec {
				commandLine glslangValidator.get(), *arguments
			}
			if (!debugInfo.get()) {
				def optimized = new File(output.parentFile, output.name + '.optimized')
				// These passes only canonicalize SPIR-V structure and remove redundant operations.
				// Do not add aggressive inlining here: it greatly increases driver compile time.
				// Dead functions may be removed after glslang has compiled the complete standalone
				// RoboCute validation module; runtime modules must not carry unreachable library code.
				execOperations.exec {
					commandLine spirvOptimizer.get(),
							'--remove-duplicates',
							'--eliminate-local-single-block',
							'--eliminate-local-single-store',
							'--ssa-rewrite',
							'--redundancy-elimination',
							'--simplify-instructions',
							'--eliminate-dead-functions',
							'--merge-blocks',
							'--compact-ids',
							output.absolutePath,
							'-o', optimized.absolutePath
				}
				java.nio.file.Files.move(
						optimized.toPath(), output.toPath(),
						java.nio.file.StandardCopyOption.REPLACE_EXISTING)
			}
			execOperations.exec {
				commandLine spirvValidator.get(), '--target-env', 'vulkan1.2', output.absolutePath
			}
		}
		sources.each { source ->
			def output = new File(scratch, source.name + '.spv')
			compileShader(source, output, [])
			// Conformance-only shaders force otherwise dormant libraries through glslang and
			// spirv-val, but are never loaded at runtime and must not inflate the distributable jar.
			if (source.name.endsWith('_validation.comp')) {
				java.nio.file.Files.delete(output.toPath())
			}
			if (source.name in [
					'world.rgen',
					'wavefront_head.rgen',
					'wavefront_step.rgen',
					'wavefront_transition.rgen',
					'wavefront_tail.rgen']) {
				// Keep a baseline module that never declares the optional extension and a separate
				// SER permutation for devices that negotiate real invocation reordering. Runtime
				// selection therefore cannot expose unsupported SPIR-V to a fallback device.
				def baseName = source.name.substring(0, source.name.length() - '.rgen'.length())
				def serOutput = new File(scratch, "${baseName}_ser.rgen.spv")
				def serDefinitions = ['-DPRIME_ENABLE_SER=1']
				if (source.name == 'wavefront_tail.rgen') {
					// The sparse tail keeps the complete result, medium and denoiser state live
					// across its local loop. Repacking those invocations spills more state than
					// it can recover through coherence; SER remains on the bounded wavefront
					// stages where only the trace key crosses the reorder point.
					serDefinitions.add('-DPRIME_DISABLE_SER_REORDER=1')
				}
				compileShader(source, serOutput, serDefinitions)
			}
		}

		def published = new File(outputDirectory.get().asFile, 'prime/shaders')
		fileSystemOperations.delete { delete published }
		published.mkdirs()
		scratch.listFiles().each { source ->
			java.nio.file.Files.move(source.toPath(), new File(published, source.name).toPath(),
					java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		}
	}
}

def resolveVulkanTool = { String name ->
	def windows = System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).contains('win')
	def extension = windows ? '.exe' : ''
	def sdk = System.getenv('VULKAN_SDK')
	if (sdk) {
		def binDirectories = windows ? ['Bin', 'bin'] : ['bin', 'Bin']
		for (def binDirectory : binDirectories) {
			def candidate = file("${sdk}/${binDirectory}/${name}${extension}")
			if (candidate.exists()) {
				return candidate.absolutePath
			}
		}
	}
	return "${name}${extension}"
}

def generateShaderAbi = tasks.register('generateShaderAbi', GenerateShaderAbi) {
	schemaFile = file('shaders/abi.json')
	javaOutputDirectory = shaderAbiJavaRoot
	glslOutputDirectory = shaderAbiIncludeRoot
}

def compileShaders = tasks.register('compileShaders', CompilePrimeShaders) {
	dependsOn generateShaderAbi, verifyRoboCutePort
	sourceDirectory = file('shaders')
	includeDirectory = shaderAbiIncludeRoot
	outputDirectory = compiledShaderRoot
	glslangValidator = resolveVulkanTool('glslangValidator')
	spirvValidator = resolveVulkanTool('spirv-val')
	spirvOptimizer = resolveVulkanTool('spirv-opt')
	debugInfo = providers.gradleProperty('primeShaderDebug')
			.map { value -> value.toBoolean() }
			.orElse(false)
}

def compileTestShaders = tasks.register('compileTestShaders', CompilePrimeShaders) {
	dependsOn verifyRoboCutePort
	sourceDirectory = file('src/test/shaders')
	includeDirectory = file('shaders')
	outputDirectory = compiledTestShaderRoot
	glslangValidator = resolveVulkanTool('glslangValidator')
	spirvValidator = resolveVulkanTool('spirv-val')
	spirvOptimizer = resolveVulkanTool('spirv-opt')
	debugInfo = false
}

sourceSets.client.java.srcDir(files(shaderAbiJavaRoot).builtBy(generateShaderAbi))
sourceSets.client.resources.srcDir(files(compiledShaderRoot).builtBy(compileShaders))
