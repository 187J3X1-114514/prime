@org.gradle.api.tasks.CacheableTask
abstract class CompilePrimeSlangComputeShaders extends DefaultTask {
	private static final java.util.concurrent.ConcurrentHashMap<
			String, java.util.concurrent.Semaphore> compilerGates =
			new java.util.concurrent.ConcurrentHashMap<>()

	@Internal
	abstract DirectoryProperty getSourceDirectory()

	@org.gradle.work.Incremental
	@InputFiles
	@PathSensitive(PathSensitivity.RELATIVE)
	abstract ConfigurableFileCollection getIncludeDirectories()

	@OutputDirectory
	abstract DirectoryProperty getOutputDirectory()

	@Input
	abstract Property<String> getSlangCompiler()

	@Input
	abstract Property<String> getSpirvValidator()

	@Input
	abstract Property<String> getDebugLevel()

	@Input
	abstract Property<Integer> getMaxCompilerProcesses()

	@Internal
	abstract DirectoryProperty getCompilerGateRoot()

	@javax.inject.Inject
	abstract org.gradle.api.file.FileSystemOperations getFileSystemOperations()

	private static void runCommand(List<String> arguments) {
		def command = arguments.collect { it.toString() }
		def process = new ProcessBuilder(command).redirectErrorStream(true).start()
		def output = new java.io.ByteArrayOutputStream()
		def outputDrain = new Thread({
			process.inputStream.transferTo(output)
		}, 'prime-shader-tool-output')
		outputDrain.start()
		try {
			def exitCode = process.waitFor()
			outputDrain.join()
			if (exitCode != 0) {
				throw new GradleException(
						"Shader tool failed with exit code ${exitCode}: ${command.join(' ')}"
								+ System.lineSeparator()
								+ output.toString(java.nio.charset.StandardCharsets.UTF_8))
			}
		} catch (InterruptedException exception) {
			process.destroyForcibly()
			outputDrain.interrupt()
			Thread.currentThread().interrupt()
			throw new GradleException(
					"Shader tool was interrupted: ${command.join(' ')}", exception)
		}
	}

	private static Map<String, Set<String>> dependencyGraph(List<File> includeRoots) {
		def sources = []
		includeRoots.each { root ->
			if (root.isDirectory()) {
				root.eachFileRecurse(groovy.io.FileType.FILES) { source ->
					if (source.name.endsWith('.slang') || source.name.endsWith('.h')) {
						sources.add(source.canonicalFile)
					}
				}
			}
		}
		def sourcePaths = sources.collect { it.canonicalPath }.toSet()
		def dependencyPattern = java.util.regex.Pattern.compile(
				'(?m)^\\s*(?:#\\s*include\\s+"([^"]+)"|import\\s+"([^"]+)"\\s*;)')
		def graph = new HashMap<String, Set<String>>()
		sources.each { source ->
			def targets = graph.computeIfAbsent(source.canonicalPath) {
				new HashSet<String>()
			}
			def matcher = dependencyPattern.matcher(source.getText('UTF-8'))
			while (matcher.find()) {
				def dependencyName = matcher.group(1) ?: matcher.group(2)
				def candidates = ([new File(source.parentFile, dependencyName)]
						+ includeRoots.collect { new File(it, dependencyName) })
						.collect { it.canonicalFile }
						.findAll { sourcePaths.contains(it.canonicalPath) }
						.unique { it.canonicalPath }
				if (candidates.size() != 1) {
					throw new GradleException(
							"Cannot resolve unique shader dependency ${dependencyName} from ${source}")
				}
				targets.add(candidates.first().canonicalPath)
			}
		}
		return graph
	}

	private static Set<String> dependencyClosure(
			File source, Map<String, Set<String>> graph) {
		def result = new HashSet<String>()
		def pending = new ArrayDeque<String>()
		pending.add(source.canonicalPath)
		while (!pending.empty) {
			def current = pending.removeLast()
			if (!result.add(current)) {
				continue
			}
			(graph[current] ?: Collections.emptySet()).each { pending.add(it) }
		}
		return result
	}

	@TaskAction
	void compile(org.gradle.work.InputChanges inputChanges) {
		def sources = sourceDirectory.get().asFileTree.matching {
			include '**/*.compute.slang',
					'**/*.raygeneration.slang',
					'**/*.miss.slang',
					'**/*.closesthit.slang',
					'**/*.anyhit.slang'
		}.files.sort { it.absolutePath }
		if (sources.empty) {
			throw new GradleException('No Prime Slang entry points were found')
		}

		def includes = includeDirectories.files
				.findAll { it.isDirectory() }
				.sort { it.absolutePath }
		def published = new File(outputDirectory.get().asFile, 'prime/shaders')
		def incremental = inputChanges.incremental && published.isDirectory()
		def changedPaths = incremental
				? inputChanges.getFileChanges(includeDirectories).collect {
					it.file.canonicalPath
				}.toSet()
				: Collections.emptySet()
		def dependencyGraph = dependencyGraph(includes)
		def dependencyClosures = new HashMap<String, Set<String>>()
		Closure<Boolean> requiresCompilation = { File source, File output ->
			if (!incremental || !output.isFile()) {
				return true
			}
			def dependencies = dependencyClosures.computeIfAbsent(source.canonicalPath) {
				CompilePrimeSlangComputeShaders.dependencyClosure(source, dependencyGraph)
			}
			return !Collections.disjoint(dependencies, changedPaths)
		}

		def scratch = new File(temporaryDir, 'spv')
		fileSystemOperations.delete { delete scratch }
		scratch.mkdirs()
		def compiler = slangCompiler.get()
		def validator = spirvValidator.get()
		def processLimit = maxCompilerProcesses.get()
		def compilerGateKey = "${compilerGateRoot.get().asFile.canonicalPath}|${processLimit}"
		def compilerGate = compilerGates.computeIfAbsent(compilerGateKey) {
			new java.util.concurrent.Semaphore(processLimit, true)
		}
		def compilationUnits = []
		def aliases = []
		def expectedOutputs = new TreeSet<String>()
		int totalCompilationUnits = 0
		sources.each { source ->
			def stages = [
					'compute': [slang: 'compute', legacy: 'comp'],
					'raygeneration': [slang: 'raygeneration', legacy: 'rgen'],
					'miss': [slang: 'miss', legacy: 'rmiss'],
					'closesthit': [slang: 'closesthit', legacy: 'rchit'],
					'anyhit': [slang: 'anyhit', legacy: 'rahit']
			]
			def suffix = stages.keySet().find { source.name.endsWith(".${it}.slang") }
			if (suffix == null) {
				throw new GradleException("Unknown Slang stage suffix: ${source}")
			}
			def stage = stages[suffix]
			def stem = source.name.substring(
					0, source.name.length() - ".${suffix}.slang".length())
			def allWavefrontVariants = source.name.startsWith('realtime_wavefront_')
					|| source.name.startsWith('offline_wavefront_')
					? [
							[name: '', definitions: []],
							[name: '_subgroup', definitions: [
									'-DPRIME_ENABLE_SUBGROUP_QUEUE=1'
							]],
							[name: '_ser', definitions: [
									'-DPRIME_ENABLE_SER=1',
									'-DPRIME_ENABLE_SUBGROUP_QUEUE=1'
							]]
					]
					: [[name: '', definitions: []]]
			// Several execution-mode names are ABI compatibility aliases, not distinct programs.
			// Publish the same validated bytes instead of asking Slang and the driver to optimize
			// unreachable mode code repeatedly. The map is backed by stripped-SPIR-V comparisons;
			// update it only when a mode becomes reachable from the corresponding entry point.
			def wavefrontVariantPlan = [
					'realtime_wavefront_head':
							[compile: ['', '_subgroup', '_ser'], alias: [:]],
					'realtime_wavefront_step':
							[compile: ['', '_subgroup', '_ser'], alias: [:]],
					'realtime_wavefront_primary':
							[compile: ['', '_subgroup'], alias: ['_ser': '_subgroup']],
					'realtime_wavefront_primary_area':
							[compile: [''], alias: ['_subgroup': '', '_ser': '']],
					'realtime_wavefront_primary_sun':
							[compile: [''], alias: ['_subgroup': '', '_ser': '']],
					'realtime_wavefront_shade':
							[compile: ['', '_subgroup'], alias: ['_ser': '_subgroup']],
					'realtime_wavefront_transparent_shade':
							[compile: ['', '_subgroup'], alias: ['_ser': '_subgroup']],
					'realtime_wavefront_light':
							[compile: [''], alias: ['_subgroup': '', '_ser': '']],
					'realtime_wavefront_resolve':
							[compile: [''], alias: ['_subgroup': '', '_ser': '']],
					'realtime_wavefront_transparent_resolve':
							[compile: [''], alias: ['_subgroup': '', '_ser': '']],
					'realtime_wavefront_sharc_shade':
							[compile: ['', '_subgroup'], alias: ['_ser': '_subgroup']],
					'realtime_wavefront_sharc_light':
							[compile: [''], alias: ['_subgroup': '', '_ser': '']],
					'offline_wavefront_head':
							[compile: ['', '_subgroup', '_ser'], alias: [:]],
					'offline_wavefront_step':
							[compile: ['', '_ser'], alias: ['_subgroup': '']],
					'offline_wavefront_area':
							[compile: ['', '_subgroup'], alias: ['_ser': '_subgroup']],
					'offline_wavefront_resolve':
							[compile: [''], alias: ['_subgroup': '', '_ser': '']]
			][stem]
			def variants = wavefrontVariantPlan == null
					? allWavefrontVariants
					: allWavefrontVariants.findAll {
						wavefrontVariantPlan.compile.contains(it.name)
					}
			wavefrontVariantPlan?.alias?.each { aliasName, compiledName ->
				expectedOutputs.add(
						"${stem}${aliasName}.${stage.legacy}.spv".toString())
				aliases.add([
						from: "${stem}${compiledName}.${stage.legacy}.spv".toString(),
						to: "${stem}${aliasName}.${stage.legacy}.spv".toString()
				])
			}
			variants.each { variant ->
				totalCompilationUnits++
				def outputName =
						"${stem}${variant.name}.${stage.legacy}.spv".toString()
				expectedOutputs.add(outputName)
				def output = new File(
						scratch,
						outputName)
				if (!requiresCompilation(source, new File(published, outputName))) {
					return
				}
				compilationUnits.add({
					def arguments = [
					compiler,
					source.absolutePath,
					'-target', 'spirv',
					'-profile', 'glsl_460',
					'-capability', 'spirv_1_5',
					// Physical pointers and non-uniform sampled-image arrays make Slang
					// close the glsl_460 profile over these SPIR-V capability aliases. Naming
					// the closure explicitly keeps warnings-as-errors useful; unused
					// capabilities are not emitted into the resulting module.
					'-capability', 'SPV_KHR_non_semantic_info',
					'-capability', 'SPV_GOOGLE_user_type',
					'-capability', 'spvSparseResidency',
					'-capability', 'spvMinLod',
					'-capability', 'spvFragmentFullyCoveredEXT',
					'-capability', 'spvGroupNonUniform',
					'-capability', 'spvGroupNonUniformBallot',
					// The typed Slang HitObject API lowers to the vendor-neutral EXT dialect.
					// Naming its capability keeps warnings-as-errors useful without permitting
					// an accidental fallback to NV-suffixed GLSL intrinsics.
					'-capability', 'spvShaderInvocationReorderEXT',
					'-entry', 'main',
					'-stage', stage.slang,
					// Explicit ray-payload locations are a cross-stage Vulkan ABI contract. The
					// Slang compatibility layer exposes location-indexed payload/hit-object
					// intrinsics while the rest of each translation unit remains ordinary Slang.
					'-allow-glsl',
					'-matrix-layout-row-major',
					'-fvk-use-gl-layout',
					'-emit-spirv-directly',
					'-warnings-as-errors', 'all',
						'-O2', debugLevel.get()
					]
					arguments.addAll(variant.definitions)
					includes.each { include ->
						arguments.addAll(['-I', include.absolutePath])
					}
					arguments.addAll(['-o', output.absolutePath])
					def permitAcquired = false
					try {
						compilerGate.acquire()
						permitAcquired = true
						CompilePrimeSlangComputeShaders.runCommand(arguments)
						CompilePrimeSlangComputeShaders.runCommand(
								[validator, '--target-env', 'vulkan1.2', output.absolutePath])
					} catch (InterruptedException exception) {
						Thread.currentThread().interrupt()
						throw new GradleException('Slang compiler scheduling was interrupted', exception)
					} finally {
						if (permitAcquired) {
							compilerGate.release()
						}
					}
					return null
				} as java.util.concurrent.Callable<Void>)
			}
		}

		def compilerCount = compilationUnits.empty ? 0 : Math.min(
				compilationUnits.size(),
				Math.min(maxCompilerProcesses.get(), Runtime.runtime.availableProcessors()))
		logger.lifecycle(
				"Compiling ${compilationUnits.size()} of ${totalCompilationUnits} Slang unit(s) with "
						+ "${compilerCount} process(es)")
		if (!compilationUnits.empty) {
			def compilerPool = java.util.concurrent.Executors.newFixedThreadPool(compilerCount)
			try {
				def compilations = compilationUnits.collect { compilerPool.submit(it) }
				compilations.each { compilation ->
					try {
						compilation.get()
					} catch (InterruptedException exception) {
						Thread.currentThread().interrupt()
						throw new GradleException('Slang compilation was interrupted', exception)
					} catch (java.util.concurrent.ExecutionException exception) {
						def cause = exception.cause
						if (cause instanceof RuntimeException) {
							throw cause
						}
						throw new GradleException('Slang compilation failed', cause)
					}
				}
			} finally {
				compilerPool.shutdownNow()
			}
		}

		published.mkdirs()
		scratch.listFiles().each { source ->
			java.nio.file.Files.move(
					source.toPath(), new File(published, source.name).toPath(),
					java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		}
		aliases.each { alias ->
			java.nio.file.Files.copy(
					new File(published, alias.from).toPath(),
					new File(published, alias.to).toPath(),
					java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		}
		def manifestName = 'manifest.sha256'
		expectedOutputs.add(manifestName)
		published.listFiles().findAll { !expectedOutputs.contains(it.name) }.each {
			java.nio.file.Files.delete(it.toPath())
		}
		def manifest = expectedOutputs.findAll { it != manifestName }.collect { name ->
			def digest = java.security.MessageDigest.getInstance('SHA-256')
					.digest(new File(published, name).bytes)
					.encodeHex().toString()
			return "${digest}  ${name}"
		}.join(System.lineSeparator()) + System.lineSeparator()
		new File(published, manifestName).setText(manifest, 'UTF-8')
	}
}


@CacheableTask
abstract class VerifySlangRayPayloadAbi extends DefaultTask {
	@InputDirectory
	@PathSensitive(PathSensitivity.RELATIVE)
	abstract DirectoryProperty getSlangDirectory()

	@Input
	abstract Property<String> getSpirvDisassembler()

	@OutputFile
	abstract RegularFileProperty getReportFile()

	private static String disassemble(String tool, File shader) {
		def process = new ProcessBuilder(tool, shader.absolutePath)
				.redirectErrorStream(true)
				.start()
		def output = process.inputStream.getText('UTF-8')
		try {
			def exitCode = process.waitFor()
			if (exitCode != 0) {
				throw new GradleException(
						"SPIR-V disassembly failed for ${shader.name}:\n${output}")
			}
		} catch (InterruptedException exception) {
			process.destroyForcibly()
			Thread.currentThread().interrupt()
			throw new GradleException(
					"SPIR-V disassembly was interrupted for ${shader.name}", exception)
		}
		return output
	}

	private static Map<String, Integer> payloadLocations(String assembly, String storageClass) {
		def names = [:]
		def nameMatcher = java.util.regex.Pattern.compile(
				'(?m)^\\s*OpName %(\\w+) "([^"]+)"\\s*$').matcher(assembly)
		while (nameMatcher.find()) {
			names[nameMatcher.group(1)] = nameMatcher.group(2)
		}
		def locations = [:]
		def locationMatcher = java.util.regex.Pattern.compile(
				'(?m)^\\s*OpDecorate %(\\w+) Location (\\d+)\\s*$').matcher(assembly)
		while (locationMatcher.find()) {
			locations[locationMatcher.group(1)] = locationMatcher.group(2) as int
		}
		def payloads = [:]
		def payloadMatcher = java.util.regex.Pattern.compile(
				'(?m)^\\s*%(\\w+) = OpVariable %\\w+ (\\w+)\\s*$')
				.matcher(assembly)
		while (payloadMatcher.find()) {
			if (payloadMatcher.group(2) != storageClass) {
				continue
			}
			def id = payloadMatcher.group(1)
			def name = names[id]
			if (name == null) {
				throw new GradleException("${storageClass} variable %${id} has no SPIR-V name")
			}
			if (locations[id] == null) {
				throw new GradleException("${storageClass} variable ${name} has no Location")
			}
			payloads[name] = locations[id]
		}
		return payloads
	}

	@TaskAction
	void verify() {
		def root = new File(slangDirectory.get().asFile, 'prime/shaders')
		def shaders = (root.listFiles() ?: [] as File[])
				.findAll { file ->
					file.name.endsWith('.rgen.spv')
							|| file.name.endsWith('.rmiss.spv')
							|| file.name.endsWith('.rchit.spv')
							|| file.name.endsWith('.rahit.spv')
				}
				.sort { it.name }
		if (shaders.empty) {
			throw new GradleException('No production Slang ray-tracing shaders were found')
		}

		def expectedOutgoing = [primeSurfacePayload: 0, primeShadowPayload: 1]
		def extSerModules = []
		shaders.each { shader ->
			def assembly = VerifySlangRayPayloadAbi.disassemble(
					spirvDisassembler.get(), shader)
			if (shader.name.endsWith('_ser.rgen.spv')) {
				if (assembly.contains('SPV_NV_shader_invocation_reorder')
						|| assembly.contains('OpReorderThreadWithHitObjectNV')) {
					throw new GradleException(
							"SER shader ${shader.name} uses the vendor-specific NV dialect")
				}
				if (assembly.contains('OpReorderThreadWithHitObjectEXT')) {
					if (!assembly.contains('SPV_EXT_shader_invocation_reorder')) {
						throw new GradleException(
								"SER shader ${shader.name} uses EXT reorder instructions without the EXT declaration")
					}
					extSerModules.add(shader.name)
				}
			}
			def outgoing = VerifySlangRayPayloadAbi.payloadLocations(
					assembly, 'RayPayloadKHR')
			outgoing.each { name, location ->
				if (expectedOutgoing[name] == null) {
					throw new GradleException(
							"Unexpected outgoing payload ${name} in ${shader.name}")
				}
				if (expectedOutgoing[name] != location) {
					throw new GradleException(
							"Outgoing payload ${name} in ${shader.name} uses location ${location}; "
									+ "expected ${expectedOutgoing[name]}")
				}
			}

			def incoming = VerifySlangRayPayloadAbi.payloadLocations(
					assembly, 'IncomingRayPayloadKHR')
			if (!incoming.isEmpty()) {
				def expectedLocation = (shader.name.startsWith('world.')
						|| shader.name.startsWith('world_')) ? 0
						: (shader.name.startsWith('shadow.')
						|| shader.name.startsWith('shadow_')) ? 1 : null
				if (expectedLocation == null) {
					throw new GradleException(
							"Incoming payload stage has no declared ABI class: ${shader.name}")
				}
				incoming.each { name, location ->
					if (location != expectedLocation) {
						throw new GradleException(
								"Incoming payload ${name} in ${shader.name} uses location ${location}; "
										+ "expected ${expectedLocation}")
					}
				}
			}
		}
		if (extSerModules.empty) {
			throw new GradleException(
					'No production SER shader emitted SPV_EXT_shader_invocation_reorder')
		}

		def report = reportFile.get().asFile
		report.parentFile.mkdirs()
		report.setText([
				'payloadAbi=valid',
				"shaderCount=${shaders.size()}",
				"extSerModules=${extSerModules.sort().join(',')}"
		].join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
	}
}

abstract class PrepareNsightCapture extends DefaultTask {
	@InputFile
	@PathSensitive(PathSensitivity.RELATIVE)
	abstract RegularFileProperty getLaunchConfig()

	@InputFile
	@PathSensitive(PathSensitivity.RELATIVE)
	abstract RegularFileProperty getArgumentFile()

	@InputFile
	@PathSensitive(PathSensitivity.RELATIVE)
	abstract RegularFileProperty getDebugShader()

	@InputFile
	@PathSensitive(PathSensitivity.NONE)
	abstract RegularFileProperty getJavaExecutable()

	@Input
	abstract Property<String> getWorkingDirectory()

	@Input
	abstract Property<Boolean> getFullShaderDebug()

	@Input
	abstract Property<String> getUserCountry()

	@Input
	abstract Property<String> getUserLanguage()

	@Input
	abstract Property<String> getUserVariant()

	@OutputFile
	abstract RegularFileProperty getReportFile()

	@TaskAction
	void prepare() {
		if (!fullShaderDebug.get()) {
			throw new GradleException(
					'Nsight capture requires primeShaderFullDebug=true so Slang emits -g2 debug information')
		}
		def shaderText = new String(
				debugShader.get().asFile.bytes,
				java.nio.charset.StandardCharsets.ISO_8859_1)
		if (!shaderText.contains('NonSemantic.Shader.DebugInfo.100')) {
			throw new GradleException(
					'Compiled production SPIR-V does not contain standard Slang debug information')
		}

		def javaPath = javaExecutable.get().asFile.absolutePath
		def workPath = workingDirectory.get()
		def argumentPath = argumentFile.get().asFile.absolutePath
		def configPath = launchConfig.get().asFile.absolutePath
		def arguments = [
				'-Dfile.encoding=UTF-8',
				"-Duser.country=${userCountry.get()}",
				"-Duser.language=${userLanguage.get()}",
				"-Duser.variant=${userVariant.get()}",
				"\"@${argumentPath}\"",
				"\"-Dfabric.dli.config=${configPath}\"",
				'-Dfabric.dli.env=client',
				'-Dfabric.dli.main=net.fabricmc.loader.impl.launch.knot.KnotClient',
				'--sun-misc-unsafe-memory-access=allow',
				'--enable-native-access=ALL-UNNAMED',
				'net.fabricmc.devlaunchinjector.Main'
		].join(' ')
		def report = reportFile.get().asFile
		report.parentFile.mkdirs()
		report.setText([
				'Nsight Graphics launch fields',
				'',
				'Executable:',
				javaPath,
				'',
				'Working directory:',
				workPath,
				'',
				'Command-line arguments:',
				arguments
		].join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
		logger.lifecycle("Nsight launch fields: ${report.absolutePath}")
	}
}

abstract class VerifySlangToolchain extends DefaultTask {
	@InputFile
	@PathSensitive(PathSensitivity.RELATIVE)
	abstract RegularFileProperty getSmokeShader()

	@Input
	abstract Property<String> getSlangCompiler()

	@Input
	abstract Property<String> getExpectedVersion()

	@Input
	abstract Property<String> getExpectedSpirvToolsVersion()

	@Input
	abstract Property<String> getSpirvValidator()

	@Input
	abstract Property<String> getSpirvDisassembler()

	private static String runAndCapture(List<String> arguments) {
		def command = arguments.collect { it.toString() }
		def process
		try {
			process = new ProcessBuilder(command)
					.redirectErrorStream(true)
					.start()
		} catch (IOException exception) {
			throw new GradleException("Could not start shader tool: ${command[0]}", exception)
		}
		def output = process.inputStream.getText('UTF-8')
		try {
			def exitCode = process.waitFor()
			if (exitCode != 0) {
				throw new GradleException(
						"Shader tool failed with exit code ${exitCode}: ${command[0]}\n${output}")
			}
		} catch (InterruptedException exception) {
			process.destroyForcibly()
			Thread.currentThread().interrupt()
			throw new GradleException("Shader tool was interrupted: ${command[0]}", exception)
		}
		return output.trim()
	}

	@TaskAction
	void verify() {
		def compiler = slangCompiler.get()
		def expected = expectedVersion.get()
		def version = runAndCapture([compiler, '-version'])
		def versionPattern = java.util.regex.Pattern.compile(
				"(?m)(^|\\s)${java.util.regex.Pattern.quote(expected)}(\\s|\$)")
		if (!versionPattern.matcher(version).find()) {
			throw new GradleException(
					"Prime requires Slang ${expected}, but ${compiler} reported: ${version}")
		}

		def expectedSpirvTools = expectedSpirvToolsVersion.get()
		def validator = spirvValidator.get()
		def validatorVersion = runAndCapture([validator, '--version'])
		if (!validatorVersion.contains(expectedSpirvTools)) {
			throw new GradleException(
					"Prime requires ${expectedSpirvTools}, but ${validator} reported: "
							+ validatorVersion)
		}
		def disassembler = spirvDisassembler.get()
		def disassemblerVersion = runAndCapture([disassembler, '--version'])
		if (!disassemblerVersion.contains(expectedSpirvTools)) {
			throw new GradleException(
					"Prime requires ${expectedSpirvTools}, but ${disassembler} reported: "
							+ disassemblerVersion)
		}

		def output = new File(temporaryDir, 'toolchain_smoke.spv')
		output.parentFile.mkdirs()
		runAndCapture([
				compiler,
				smokeShader.get().asFile.absolutePath,
				'-target', 'spirv',
				'-profile', 'glsl_460',
				'-capability', 'spirv_1_5',
				'-entry', 'main',
				'-stage', 'compute',
				// Slang matrix terminology is inverted when lowered to SPIR-V. This emits the
				// ColMajor decoration used by the existing GLSL ABI.
				'-matrix-layout-row-major',
				'-fvk-use-gl-layout',
				'-emit-spirv-directly',
				'-warnings-as-errors', 'all',
				'-O0', '-g0',
				'-o', output.absolutePath
		])
		runAndCapture([
				spirvValidator.get(),
				'--target-env', 'vulkan1.2',
				output.absolutePath
		])
		def assembly = runAndCapture([spirvDisassembler.get(), output.absolutePath])
		def abiPatterns = [
				'(?m)OpMemberDecorate %\\w+ 0 ColMajor$',
				'(?m)OpMemberDecorate %\\w+ 0 MatrixStride 16$',
				'(?m)OpMemberDecorate %\\w+ 1 Offset 64$',
				'(?m)OpDecorate %\\w+ Binding 0$',
				'(?m)OpDecorate %\\w+ DescriptorSet 0$',
				'(?m)OpTypePointer PushConstant '
		]
		def missing = abiPatterns.findAll { pattern ->
			!java.util.regex.Pattern.compile(pattern).matcher(assembly).find()
		}
		if (!missing.empty) {
			throw new GradleException(
					"Slang smoke SPIR-V does not preserve the Prime ABI baseline: ${missing}")
		}
	}
}

abstract class VerifyGeneratedSlangAbi extends DefaultTask {
	@InputFile
	@PathSensitive(PathSensitivity.RELATIVE)
	abstract RegularFileProperty getSchemaFile()

	@InputFile
	@PathSensitive(PathSensitivity.RELATIVE)
	abstract RegularFileProperty getSmokeShader()

	@InputDirectory
	@PathSensitive(PathSensitivity.RELATIVE)
	abstract DirectoryProperty getGeneratedIncludeDirectory()

	@Input
	abstract Property<String> getSlangCompiler()

	@Input
	abstract Property<String> getSpirvValidator()

	@Input
	abstract Property<String> getSpirvDisassembler()

	private static String runAndCapture(List<String> arguments) {
		def command = arguments.collect { it.toString() }
		def process
		try {
			process = new ProcessBuilder(command)
					.redirectErrorStream(true)
					.start()
		} catch (IOException exception) {
			throw new GradleException("Could not start shader tool: ${command[0]}", exception)
		}
		def output = process.inputStream.getText('UTF-8')
		try {
			def exitCode = process.waitFor()
			if (exitCode != 0) {
				throw new GradleException(
						"Shader tool failed with exit code ${exitCode}: ${command[0]}\n${output}")
			}
		} catch (InterruptedException exception) {
			process.destroyForcibly()
			Thread.currentThread().interrupt()
			throw new GradleException("Shader tool was interrupted: ${command[0]}", exception)
		}
		return output.trim()
	}

	@TaskAction
	void verify() {
		def output = new File(temporaryDir, 'generated_abi_smoke.spv')
		output.parentFile.mkdirs()
		runAndCapture([
				slangCompiler.get(),
				smokeShader.get().asFile.absolutePath,
				'-I', generatedIncludeDirectory.get().asFile.absolutePath,
				'-target', 'spirv',
				'-profile', 'glsl_460',
				'-capability', 'spirv_1_5',
				'-entry', 'main',
				'-stage', 'compute',
				'-matrix-layout-row-major',
				'-fvk-use-gl-layout',
				'-emit-spirv-directly',
				'-warnings-as-errors', 'all',
				'-O0', '-g0',
				'-o', output.absolutePath
		])
		runAndCapture([
				spirvValidator.get(),
				'--target-env', 'vulkan1.2',
				output.absolutePath
		])
		def assembly = runAndCapture([spirvDisassembler.get(), output.absolutePath])
		def schema = new groovy.json.JsonSlurper().parse(schemaFile.get().asFile)
		def structNames = [
				primitiveRecord: 'PrimitiveRecord',
				sectionRecord: 'SectionRecord',
				lightNode: 'LightNode',
				lightLeaf: 'LightLeaf',
				lightLeafEntry: 'LightLeafEntry',
				lightEmitter: 'LightEmitter',
				lightCell: 'LightCell',
				sectionLightHeader: 'SectionLightHeader',
				integratorRecord: 'IntegratorRecord',
				pathState: 'PathState',
				tracePayload: 'TracePayload',
				surfaceInteraction: 'SurfaceInteraction',
				nrdMotionPushConstants: 'NrdMotionPushConstants',
				sharcFrameConstants: 'SharcFrameConstants'
		]
		def missing = []
		structNames.each { schemaName, slangName ->
			def definition = schema.structs[schemaName]
			definition.fields.eachWithIndex { field, index ->
				def pattern = "(?m)^\\s*OpMemberDecorate %${slangName}_std430 ${index} Offset ${field.offset}\\s*\$"
				if (!java.util.regex.Pattern.compile(pattern).matcher(assembly).find()) {
					missing.add("${slangName}.${field.name} offset ${field.offset}")
				}
			}
			def stridePattern = "(?m)^\\s*OpDecorate %_runtimearr_${slangName}_std430 ArrayStride ${definition.size}\\s*\$"
			if (!java.util.regex.Pattern.compile(stridePattern).matcher(assembly).find()) {
				missing.add("${slangName} stride ${definition.size}")
			}
		}
		def section = schema.structs.sectionRecord
		def physicalSectionStride =
				"(?m)^\\s*OpDecorate %_ptr_PhysicalStorageBuffer_SectionRecord_natural ArrayStride ${section.size}\\s*\$"
		if (!java.util.regex.Pattern.compile(physicalSectionStride).matcher(assembly).find()) {
			missing.add("SectionRecord physical-pointer stride ${section.size}")
		}
		def push = schema.structs.pushConstants
		push.fields.eachWithIndex { field, index ->
			def pattern = "(?m)^\\s*OpMemberDecorate %PrimePushConstants_std430 ${index} Offset ${field.offset}\\s*\$"
			if (!java.util.regex.Pattern.compile(pattern).matcher(assembly).find()) {
				missing.add("PrimePushConstants.${field.name} offset ${field.offset}")
			}
		}
		[
				'(?m)^\\s*OpMemberDecorate %PrimePushConstants_std430 0 ColMajor\\s*$',
				'(?m)^\\s*OpMemberDecorate %PrimePushConstants_std430 0 MatrixStride 16\\s*$',
				'(?m)^\\s*OpDecorate %outputValues Binding 14\\s*$',
				'(?m)^\\s*OpDecorate %outputValues DescriptorSet 0\\s*$',
				'(?m)^\\s*%\\w+ = OpTypePointer PushConstant '
		].each { pattern ->
			if (!java.util.regex.Pattern.compile(pattern).matcher(assembly).find()) {
				missing.add(pattern)
			}
		}
		if (!missing.empty) {
			throw new GradleException(
					"Generated Slang ABI does not match shaders/abi.json: ${missing}")
		}
	}
}

def resolveVulkanTool = { String name ->
	def windows = System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).contains('win')
	def extension = windows ? '.exe' : ''
	def sdk = System.getenv('VULKAN_SDK')
	if (sdk) {
		def binDirectories = windows ? ['Bin', 'bin'] : ['bin', 'Bin']
		for (def binDirectory : binDirectories) {
			def candidate = file("${sdk}/${binDirectory}/${name}${extension}")
			if (candidate.exists()) {
				return candidate.absolutePath
			}
		}
	}
	return "${name}${extension}"
}

