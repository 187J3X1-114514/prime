name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Set up Vulkan SDK toolchain
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1
        with:
          vulkan_version: 1.4.357.0
          install_runtime: 'false'
          cache: 'true'
      - name: Report shader tool versions
        run: |
          "$VULKAN_SDK/bin/spirv-val" --version
          "$VULKAN_SDK/bin/slangc" -version
      - name: Set up headless Vulkan compute
        run: |
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers vulkan-tools
          lvp_icd="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$lvp_icd"
          echo "VK_DRIVER_FILES=$lvp_icd" >> "$GITHUB_ENV"
          VK_DRIVER_FILES="$lvp_icd" vulkaninfo --summary
      - name: Provide Slang compiler swap
        run: |
          available_kib="$(df --output=avail -k / | tail -n 1)"
          reserve_kib=$((8 * 1024 * 1024))
          swap_kib=$((available_kib - reserve_kib))
          maximum_swap_kib=$((32 * 1024 * 1024))
          if ((swap_kib > maximum_swap_kib)); then
            swap_kib=$maximum_swap_kib
          fi
          if ((swap_kib < 8 * 1024 * 1024)); then
            echo "Insufficient disk space for the Slang compiler: ${available_kib} KiB available" >&2
            exit 1
          fi
          sudo fallocate -l "${swap_kib}K" /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
      - name: Build and test
        run: ./gradlew --no-daemon --stacktrace -PprimeSlangCompilerWorkers=1 clean build shaderTest
      - name: Capture test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: prime-test-reports-${{ github.sha }}
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
      - name: Capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: prime-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
